<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة الأنشطة التربوية</title>
<meta name="description" content="تخطيط أنشطة المسارات ومتابعتها — أكاديمية الجيل الصاعد الإلكترونية">
<meta name="theme-color" content="#f7f7f7">
<meta name="robots" content="noindex">
<link rel="icon" href="img/anshita.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap">
<style>
/* منصة الأنشطة التربوية — هوية «أثر» بألوان الأنشطة التربوية
   أبيض و#f7f7f7، حبر أسود، عناوين ثمانية، أزرار حبّية سوداء، بطاقات بيضاء بحواف واسعة، مربعات أيقونات باستيل.
   ألوان الشعار: فيروزي #3c7e79، بنفسجي #4c2e5f، عنابي #b6293e، برتقالي #e1642b. لكل مسار لونه.
   العنصر المميز: «نبض المسارات» — أشرطة الشعار نفسها، شريط لكل مسار مقسوم على أسابيع الفصل. */
:root{
  color-scheme:light;
  --canvas:#f7f7f7; --surface:#ffffff; --raised:#ffffff; --sunken:#f0f0f0; --hover:#f3f3f3; --press:#e9e9e9;
  --ink:#000000; --ink1:#171717; --ink2:#5e5e5e; --ink3:#707070; --ink4:#8f8f8f;
  --line:#ececec; --line2:#d6d6d6;
  --brand:#3c7e79; --brand-ink:#2c625e; --brand-t:rgba(60,126,121,.11); --brand-t2:rgba(60,126,121,.2);
  --plum:#4c2e5f; --wine:#b6293e; --amber:#e1642b;
  --ok:#2f8a57; --ok-t:rgba(47,138,87,.12); --warn:#c4670f; --warn-t:rgba(225,100,43,.13); --bad:#b6293e; --bad-t:rgba(182,41,62,.1);
  --btn:#000000; --btn-ink:#ffffff;
  --sh1:0 .6px .6px -1.25px rgba(0,0,0,.16),0 2.3px 2.3px -2.5px rgba(0,0,0,.14),0 10px 10px -3.75px rgba(0,0,0,.05);
  --sh2:0 1px 2px rgba(0,0,0,.06),0 18px 44px -14px rgba(0,0,0,.16);
  --sh3:0 2px 4px rgba(0,0,0,.08),0 30px 70px -20px rgba(0,0,0,.3);
  /* ثمانية: العناوين Serif Display، المحتوى Serif Text، الواجهة والأرقام Sans */
  --fd:'thm-display','Noto Naskh Arabic',Tahoma,serif;
  --ft:'thm-text','Noto Naskh Arabic',Tahoma,serif;
  --fn:'thm-sans','Noto Kufi Arabic',Tahoma,sans-serif;
  --r1:10px; --r2:16px; --r3:24px; --r4:28px;
  --ease:cubic-bezier(.22,1,.36,1);
  --side:256px;
  /* أنواع الأنشطة */
  --ty-meet:#3c7e79; --ty-write:#4c2e5f; --ty-group:#e1642b; --ty-comp:#b6293e; --ty-kahoot:#6d4bb3; --ty-chal:#5b7d2a; --ty-host:#a8770c; --ty-other:#828282;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e1010; --surface:#161919; --raised:#1c2020; --sunken:#202525; --hover:#1f2424; --press:#272d2d;
  --ink:#ffffff; --ink1:#ececec; --ink2:#a9b0af; --ink3:#868e8d; --ink4:#626a69;
  --line:#242a2a; --line2:#353c3c;
  --brand:#6fb3ac; --brand-ink:#8fcac3; --brand-t:rgba(111,179,172,.14); --brand-t2:rgba(111,179,172,.24);
  --ok:#62c18b; --ok-t:rgba(98,193,139,.14); --warn:#f0a057; --warn-t:rgba(240,160,87,.14); --bad:#ef7d8e; --bad-t:rgba(239,125,142,.13);
  --btn:#ffffff; --btn-ink:#000000;
  --sh1:0 1px 2px rgba(0,0,0,.5),0 8px 18px -8px rgba(0,0,0,.35);
  --sh2:0 1px 2px rgba(0,0,0,.5),0 18px 44px -14px rgba(0,0,0,.6);
  --sh3:0 2px 4px rgba(0,0,0,.5),0 30px 70px -20px rgba(0,0,0,.75);
  --ty-meet:#6fb3ac; --ty-write:#b597d0; --ty-group:#f0915e; --ty-comp:#ef7d8e; --ty-kahoot:#a58bea; --ty-chal:#9cc364; --ty-host:#e0b04a; --ty-other:#9aa1a0;
}
*{box-sizing:border-box}
html{direction:rtl;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--canvas)}
body{color:var(--ink1);font-family:var(--fn);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,h4{font-family:var(--fd);color:var(--ink);margin:0;line-height:1.25;font-weight:500;text-wrap:balance}
h1{font-size:clamp(28px,3.6vw,40px)}
h2{font-size:clamp(20px,2.2vw,24px)}
h3{font-size:17px}
p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
::selection{background:var(--brand-t2)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.sm{font-size:14.5px}.xs{font-size:13px;line-height:1.5}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column}
.sp{flex:1}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
bdi{unicode-bidi:isolate}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
svg{flex:none;width:18px;height:18px}
.demo-bar svg{width:17px;height:17px}
.side .find svg{width:17px;height:17px}
.hint svg{width:14px;height:14px;vertical-align:-2px}

/* ============ الإطار: شريط جانبي + المحتوى ============ */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;gap:4px;overflow-y:auto;z-index:20}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.side .brand img{height:40px;width:auto}
.brand-img{display:block}
:root[data-theme="dark"] .brand-img{filter:brightness(1.55) saturate(.9)}
.side .find{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:12px;background:var(--sunken);color:var(--ink3);font-size:14.5px;margin-bottom:10px;transition:background .2s}
.side .find:hover{background:var(--press)}
.side .find kbd{margin-inline-start:auto}
kbd{font-family:var(--fn);font-size:11px;line-height:1;padding:3px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--ink3);background:var(--surface)}
.nav-h{font-size:12.5px;color:var(--ink3);padding:14px 10px 4px;font-family:var(--fn)}
.nl{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:11px;color:var(--ink2);font-size:15.5px;text-decoration:none;transition:background .15s,color .15s;position:relative;text-align:start}
.nl:hover{background:var(--hover);color:var(--ink1)}
.nl[aria-current="page"]{background:var(--sunken);color:var(--ink);font-weight:600}
.nl svg{width:19px;height:19px;color:var(--ink3)}
.nl[aria-current="page"] svg{color:var(--ink)}
.nl .dot{width:10px;height:10px;border-radius:4px;flex:none;margin-inline:4px}
.nl .cnt{margin-inline-start:auto;font-family:var(--fn);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nl .badge{margin-inline-start:auto}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;width:100%;text-align:start}
.who:hover{background:var(--hover)}
.who .av{width:32px;height:32px;font-size:14px}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);padding:0 10px;font-family:var(--fn)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.sync.off i{background:var(--warn)}
.sync.busy i{background:var(--brand);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.main{min-width:0;padding:30px clamp(18px,3.4vw,44px) 90px}
.wrap{max-width:1180px;margin-inline:auto}
.topbar,.tabbar{display:none}
.demo-bar{background:var(--brand-t);color:var(--brand-ink);font-size:13.5px;padding:7px 14px;border-radius:12px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.demo-bar button{text-decoration:underline;color:inherit}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:25;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar img{height:32px;width:auto}
  .main{padding:18px 16px 110px}
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink3);text-decoration:none;padding:6px 2px;border-radius:12px;font-family:var(--fn)}
  .tabbar svg{width:22px;height:22px}
  .tabbar [aria-current="page"]{color:var(--ink)}
}

/* ============ عناصر مشتركة ============ */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:9px 18px;font-size:15px;line-height:1.3;white-space:nowrap;background:var(--sunken);color:var(--ink1);transition:transform .18s var(--ease),background .18s,box-shadow .18s,opacity .18s}
.btn:hover{background:var(--press)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{opacity:.86}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 13px;font-size:14px}
.btn.icon{padding:8px;border-radius:12px;background:transparent;color:var(--ink2)}
.btn.icon:hover{background:var(--hover);color:var(--ink1)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:16px;height:16px}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-inline-end-color:transparent;animation:rot .8s linear infinite;opacity:.7}
@keyframes rot{to{transform:rotate(-360deg)}}
.card{background:var(--surface);border-radius:var(--r3);box-shadow:var(--sh1);padding:22px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2,.card-h h3{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;line-height:1.5;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--ok-t);color:var(--ok)}.pill.warn{background:var(--warn-t);color:var(--warn)}.pill.bad{background:var(--bad-t);color:var(--bad)}.pill.brand{background:var(--brand-t);color:var(--brand-ink)}
.pill.dash{background:transparent;border:1px dashed var(--line2);color:var(--ink3)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--wine);color:#fff;font-size:11.5px;font-family:var(--fn);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.badge.soft{background:var(--sunken);color:var(--ink2)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-family:var(--fn);font-weight:500;flex:none;width:28px;height:28px;font-size:12.5px;letter-spacing:-.02em}
.tile{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc)}
.tile svg{width:17px;height:17px}
.tile.sm{width:24px;height:24px;border-radius:7px}.tile.sm svg{width:14px;height:14px}
.tile.lg{width:40px;height:40px;border-radius:12px}.tile.lg svg{width:22px;height:22px}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px}
.seg button{border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:14px;border:1px solid var(--line2);color:var(--ink2);background:var(--surface);white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--ink1);color:var(--surface);border-color:var(--ink1)}
.chip i{width:9px;height:9px;border-radius:3px;display:block;flex:none}
.sw{position:relative;width:40px;height:24px;border-radius:999px;background:var(--line2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s var(--ease)}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{inset-inline-start:19px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13.5px;color:var(--ink2);font-family:var(--fn)}
.inp{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:10px 13px;font-size:15.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-t)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.7}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:14px 50%,19px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:13px;padding-inline-end:13px;padding-left:32px}
.inp.big{font-family:var(--fd);font-size:22px;border:0;padding:4px 0;border-radius:0;box-shadow:none;background:transparent}
.inp.big:focus{box-shadow:none}
.hint{font-size:13px;color:var(--ink3)}
.err{color:var(--bad);font-size:14px}
.empty{padding:36px 20px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:34px;height:34px;color:var(--ink4)}
.empty h3{font-size:18px}
.sep{height:1px;background:var(--line);margin:16px 0}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--fd);font-weight:500;font-size:21px;color:var(--ink);line-height:1.3}
.kv span{font-size:13px;color:var(--ink3)}
.lk{color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ============ رأس الصفحة ============ */
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph .t{flex:1;min-width:240px}
.ph .eyebrow{font-size:14px;color:var(--ink3);margin-bottom:6px}
.ph .lead{font-size:16.5px;color:var(--ink2);margin-top:8px;max-width:62ch}
.reveal .w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(6px);animation:wordin .7s var(--ease) forwards}
@keyframes wordin{to{opacity:1;filter:blur(0);transform:none}}

/* ============ الدخول ============ */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:var(--canvas)}
.login .box{width:min(760px,100%);display:flex;flex-direction:column;gap:22px}
.login .head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.login .head img{height:64px;width:auto}
.login h1{font-size:clamp(30px,5vw,46px)}
.login .who-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.login .who-grid .wt{flex:0 1 172px}
@media (max-width:520px){.login .who-grid .wt{flex-basis:calc(50% - 5px)}}
.login .wt{background:var(--surface);border-radius:20px;padding:14px 12px 12px;box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent;transition:transform .2s var(--ease),border-color .2s}
.login .wt:hover{transform:translateY(-2px)}
.login .wt[aria-pressed="true"]{border-color:var(--ink1)}
.login .wt .lg{height:52px;display:flex;align-items:center;justify-content:center}
.login .wt .lg img{max-height:52px;max-width:118px;object-fit:contain}
.login .wt span{font-size:14.5px;color:var(--ink2)}
.login form{background:var(--surface);border-radius:var(--r3);box-shadow:var(--sh1);padding:22px;display:flex;flex-direction:column;gap:14px}
.login .alt{text-align:center;font-size:14px}

/* ============ نبض المسارات ============ */
.pulse{padding:22px 22px 18px}
.pulse-grid{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) minmax(150px,210px);column-gap:18px;row-gap:9px;align-items:center}
.pulse .hdr{font-size:12px;color:var(--ink3);font-family:var(--fn)}
.pulse .weeks{display:grid;gap:4px;grid-template-columns:repeat(var(--n),minmax(0,1fr));align-items:center}
.pulse .weeks.h span{text-align:center;font-variant-numeric:tabular-nums;border-radius:6px;padding:1px 0}
.pulse .weeks.h span.now{background:var(--ink1);color:var(--surface)}
.pulse .tn{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit;border-radius:12px;padding:2px 4px}
.pulse .tn:hover{background:var(--hover)}
.pulse .tn img{width:34px;height:34px;object-fit:contain;flex:none}
.pulse .tn b{font-family:var(--fd);font-weight:500;font-size:16.5px;color:var(--ink)}
.wk{height:26px;border-radius:7px;background:var(--sunken);position:relative;transform-origin:right center;transition:transform .15s}
.wk:hover{transform:scaleY(1.18)}
.wk.f{background:var(--tc);opacity:var(--o,1)}
.wk.past0{background:transparent;border:1.5px dashed var(--line2)}
.wk.off{background:repeating-linear-gradient(-45deg,var(--sunken) 0 4px,transparent 4px 8px);border:1px solid var(--line)}
.wk.now{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink1)}
.wk.f.now{opacity:1}
.draw .wk{animation:wkin .6s var(--ease) both;animation-delay:calc(var(--i)*22ms + var(--r)*60ms)}
@keyframes wkin{from{transform:scaleX(0);opacity:0}}
.pulse .st{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.pulse .st .lab{min-width:0}
.pulse .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--ink3);font-family:var(--fn)}
.pulse .legend span{display:inline-flex;align-items:center;gap:6px}
.pulse .legend i{width:16px;height:10px;border-radius:3px;display:block}
.hl{display:inline-flex;align-items:center;gap:6px}
.hl i{width:8px;height:8px;border-radius:50%;display:block;flex:none}
.hl.ok i{background:var(--ok)}.hl.warn i{background:var(--warn)}.hl.none i{background:transparent;border:1.5px dashed var(--ink4);width:9px;height:9px}.hl.grey i{background:var(--ink4)}
@media (max-width:760px){
  .pulse{padding:16px 14px}
  .pulse-grid{grid-template-columns:minmax(0,1fr) auto;row-gap:6px;grid-auto-flow:row dense}
  .pulse-grid .tn{grid-column:1}.pulse-grid .st{grid-column:2;justify-content:flex-end}
  .pulse-grid .weeks{grid-column:1/-1;margin-bottom:10px}
  .pulse-grid .hdr.w,.pulse-grid .hdr.s{display:none}
  .pulse-grid .hdr.t{grid-column:1/-1}
  .wk{height:20px;border-radius:5px}
}

.sheet .sh-b{flex:1;overflow-y:auto;padding:4px 22px 18px;display:flex;flex-direction:column;gap:16px}

.dlg{position:fixed;z-index:100;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:var(--r3);box-shadow:var(--sh3);padding:22px;display:flex;flex-direction:column;gap:14px;animation:pop .25s var(--ease)}

}
.types{display:flex;flex-wrap:wrap;gap:6px}

.ctx{background:var(--canvas);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}

.whos input{border:1px dashed var(--line2);border-radius:999px;padding:4px 12px;font-size:14px;width:130px;outline:none;background:transparent}

/* لوحة الأوامر */
.cmd{position:fixed;z-index:120;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--surface);border-radius:22px;box-shadow:var(--sh3);overflow:hidden;animation:pop2 .2s var(--ease)}
@keyframes pop2{from{transform:translateX(-50%) translateY(-6px);opacity:0}}
.cmd .q{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.cmd .q svg{width:20px;height:20px;color:var(--ink3)}
.cmd .q input{flex:1;border:0;outline:0;background:transparent;font-size:18px}
.cmd .res{max-height:56vh;overflow-y:auto;padding:6px}
.cmd .grp{font-size:12px;color:var(--ink3);padding:10px 12px 4px;font-family:var(--fn)}
.cmd .it{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:9px 12px;border-radius:12px;font-size:15px}
.cmd .it[aria-selected="true"]{background:var(--sunken)}
.cmd .it .mt{margin-inline-start:auto;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.cmd .it img{width:24px;height:24px;object-fit:contain}

/* الإشعارات المنبثقة */
#toasts{position:fixed;z-index:150;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink1);color:var(--surface);border-radius:999px;padding:9px 10px 9px 18px;box-shadow:var(--sh2);font-size:14.5px;animation:tin .3s var(--ease)}
.toast.err{background:var(--bad);color:#fff}
.toast button{background:color-mix(in srgb,var(--surface) 18%,transparent);color:inherit;border-radius:999px;padding:4px 12px;font-size:13.5px}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media (max-width:1000px){#toasts{bottom:86px}}
.tip{position:fixed;z-index:160;pointer-events:none;background:var(--ink1);color:var(--surface);font-size:13px;line-height:1.5;border-radius:10px;padding:7px 11px;max-width:280px;box-shadow:var(--sh2)}

/* شريط التحديد الجماعي */
.bulk{position:fixed;z-index:60;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--sh3);border:1px solid var(--line);animation:tin .25s var(--ease);max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
@media (max-width:1000px){.bulk{bottom:84px;border-radius:22px}}
.calrow{display:grid;grid-template-columns:28px 92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.calrow:last-child{border-bottom:0}
.calrow .d{font-size:13.5px;color:var(--ink2);line-height:1.35}
.calrow .d b{display:block;font-family:var(--fd);font-weight:500;color:var(--ink1);font-size:14.5px}
@media (max-width:640px){.calrow{grid-template-columns:28px minmax(0,1fr);}.calrow .d{grid-column:2}.calrow .st{grid-column:2}}

/* تليجرام */
.tgmsg{background:#e7f4e1;color:#14231a;border-radius:16px 16px 4px 16px;padding:10px 13px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;max-width:360px;box-shadow:0 1px 1px rgba(0,0,0,.08);font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}
:root[data-theme="dark"] .tgmsg{background:#2b5240;color:#eaf4ee}
.tgwall{background:linear-gradient(135deg,#cfe0c3,#e6edd2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

.steps3{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps3 li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps3 li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--sunken);display:inline-flex;align-items:center;justify-content:center;font-family:var(--fn);font-size:13px;flex:none;color:var(--ink1)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.reveal .w{opacity:1;filter:none;transform:none}}
@media print{.side,.topbar,.tabbar,.toolbar,.btn,#toasts{display:none!important}.app{display:block}.main{padding:0}}

/* المحتوى بخط ثمانية للنصوص */

:root[data-theme="dark"] .pulse .tn img,:root[data-theme="dark"] .lrow .lab img,:root[data-theme="dark"] .lw .ln img,:root[data-theme="dark"] .cmd .it img,:root[data-theme="dark"] .li>img{background:#f2f2f2;border-radius:9px;padding:3px}

.report .md{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--ft);font-size:16px;line-height:1.85;color:var(--ink1);max-width:78ch}

.ev.tinted{background:color-mix(in srgb,var(--tcol) 11%,var(--surface));border-color:color-mix(in srgb,var(--tcol) 30%,var(--line));border-inline-start:5px solid var(--tcol)}

/* صفحة المسارات */
.tcard{text-decoration:none;display:flex;flex-direction:column;gap:10px;background:linear-gradient(to bottom,color-mix(in srgb,var(--tc) 10%,var(--surface)),var(--surface) 55%);border-top:4px solid var(--tc)}
.tcard .tlogo{height:84px;display:flex;align-items:center;justify-content:flex-start}
.tcard .tlogo img{max-height:84px;max-width:170px;width:auto;height:auto;object-fit:contain}

:root[data-theme="dark"] .tcard .tlogo img{background:#f2f2f2;border-radius:12px;padding:6px}
.board .ev .tile{display:none}
.board .ev{padding:7px 9px}

/* ============ صفحة المسار: الجدول يمين ولوحة النشاط الثابتة يسار ============ */
.wrap.wide{max-width:1560px}
.tlay{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,27vw,400px);gap:20px;align-items:start}
.tmain{min-width:0}
.dock{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh1);overflow:hidden}
.dock.editing{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));box-shadow:0 0 0 3px var(--brand-t),var(--sh1)}
.dk-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dk-h>.col,.dk-h>.row{flex:1;min-width:0}

.ev.big{border-inline-start:4px solid var(--tyc);background:color-mix(in srgb,var(--tyc) 7%,var(--surface));padding:9px 10px;border-color:color-mix(in srgb,var(--tyc) 22%,var(--line))}

.ev .cl{color:var(--warn);display:inline-flex}

.stbl td.dy{width:118px;white-space:nowrap;position:relative}

.mday.selrow{border-color:var(--brand)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--bad) 10%,transparent);color:color-mix(in srgb,var(--bad) 80%,var(--ink1));white-space:nowrap}
.live svg{width:14px;height:14px}

.clashn{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink1);background:color-mix(in srgb,var(--warn) 13%,var(--surface));border-radius:10px;padding:6px 9px}

.srow{display:flex;align-items:center;gap:12px;padding:10px 16px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}

function toggleTheme() { P.theme = P.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); render(); }

/* ---------- الخطوط: ثمانية من خادم المنصة أو من خادم «أثر»، وتُحفظ في المتصفح ---------- */
const FONT_NEED = { 'thm-display': ['500', '700'], 'thm-text': ['400', '500', '700'], 'thm-sans': ['400', '500', '700'] };
const IDB = {
  db: null,
  open() { if (this.db) return this.db; this.db = new Promise((ok, no) => { try { const r = indexedDB.open('anshita', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } }); return this.db; },
  async get(k) { try { const db = await this.open(); return await new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch (e) { return null; } },
  async put(k, v) { try { const db = await this.open(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }
};
function b64ToBlob(b64, mime) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime }); }
async function loadFonts() {
  const want = f => FONT_NEED[f.family] && FONT_NEED[f.family].includes(String(f.weight));
  if (CFG.fonts) {   // نسخة التجربة: الخطوط مضمّنة كما هي
    await Promise.all(CFG.fonts.map(f => new FontFace(f.family, `url(${f.url})`, { weight: f.weight, display: 'swap' }).load().then(ff => document.fonts.add(ff)).catch(() => {})));
    return;
  }
  const srcs = [CFG.api, CFG.fontApi].filter(Boolean);
  for (const src of srcs) {
    const call = async (fn, ...args) => { const r = await fetch(src, { method: 'POST', body: JSON.stringify({ fn, args }), redirect: 'follow', credentials: 'omit' }); const j = await r.json(); if (j.error) throw new Error(j.error); let v = j.result; try { v = JSON.parse(v); } catch (e) {} return v; };
    let list = LS.get(NS + 'fonts:' + src, null);
    if (!list) { try { list = (await call('ui_fonts')).filter(want); LS.set(NS + 'fonts:' + src, list); } catch (e) { list = []; } }
    if (!list.length) continue;
    await Promise.all(list.map(async f => {
      const key = 'font:' + src + ':' + f.id + ':' + (f.ver || 1);
      let blob = await IDB.get(key);
      if (!blob) { try { blob = b64ToBlob(await call('ui_font_get', f.id), 'font/otf'); IDB.put(key, blob); } catch (e) { return; } }
      try { const ff = new FontFace(f.family, `url(${URL.createObjectURL(blob)})`, { weight: String(f.weight), display: 'swap' }); await ff.load(); document.fonts.add(ff); } catch (e) {}
    }));
    return;
  }
}

/* ---------- الإشعارات والتلميحات ---------- */
function toast(msg, kind, undo) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">تراجع</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { el.remove(); undo(); };
  box.appendChild(el);
  setTimeout(() => el.remove(), undo ? 6500 : kind === 'err' ? 6000 : 3200);
  while (box.children.length > 3) box.firstChild.remove();
}
function announce(m) { const l = $('#live'); if (l) { l.textContent = ''; setTimeout(() => l.textContent = m, 30); } }
let tipEl = null;
document.addEventListener('pointerover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { if (tipEl) { tipEl.remove(); tipEl = null; } return; }
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
  tipEl.textContent = t.dataset.tip;
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tipEl.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
});
document.addEventListener('scroll', () => { if (tipEl) { tipEl.remove(); tipEl = null; } }, true);

/* ---------- التحميل والتحديث الدوري ---------- */
function setBoot(b) {
  D = b; if (b.today) TODAY = b.today;
  D.tracks.forEach(t => planOf(t.id));
  indexHijri();
  try { LS.set(NS + 'boot', b); } catch (e) {}
}
async function boot(silent) {
  try {
    const b = await API.me('boot'); setBoot(b); setSync('ok'); render(); startPoll();
  } catch (e) {
    if (e.code === 'auth') { logout(); LG.err = e.message; render(); return; }
    setSync('off');
    if (!D) { const c = LS.get(NS + 'boot', null); if (c) { setBoot(c); render(); startPoll(); toast('تعرض آخر نسخة محفوظة: ' + e.message, 'err'); return; } }
    if (!silent) toast(e.message, 'err');
    if (!D) { $('#app').innerHTML = `<div class="login"><div class="box"><div class="card empty">${svg('alert')}<h3>تعذّر فتح المنصة</h3><p>${esc(e.message)}</p><button class="btn pri" type="button" data-act="retry">إعادة المحاولة</button></div></div></div>`; }
  }
}
let POLL = null;
function startPoll() { stopPoll(); POLL = setInterval(poll, 30000); }
function stopPoll() { if (POLL) clearInterval(POLL); POLL = null; }
let polling = false;
async function poll(force) {
  if (!D || polling || (document.hidden && !force)) return;
  polling = true;
  try {
    const r = await API.me('revs'), changed = [];
    if (r._meta !== D.revs._meta) { await boot(true); polling = false; return; }
    for (const id of Object.keys(r)) {
      if (id[0] === '_' || r[id] === D.revs[id]) continue;
      D.plans[id] = await API.me('plan', id); D.revs[id] = r[id]; changed.push(id);
    }
    if (r._log !== D.revs._log) { D.log = (await API.me('log_list')).slice(0, 60); D.revs._log = r._log; }
    if (r._alerts !== undefined && r._alerts !== D.revs._alerts) {
      const prevTop = (D.alerts || [])[0] && D.alerts[0].id;
      D.alerts = (await API.me('alerts')).slice(0, 40); D.unseen = D.alerts.filter(x => !x.seen).length; D.revs._alerts = r._alerts;
      const top = D.alerts[0]; if (top && top.id !== prevTop && !top.seen) { toast('تغيير من ' + top.by + ': ' + qt(top.title)); changed.push('_alerts'); }
    }
    setSync('ok');
    if (changed.length) {
      indexHijri();
      if (!$('#layer').innerHTML && !(F && F.dock)) render(); else PENDING_RENDER = true;
      const by = (D.log || []).find(x => changed.includes(x.t));
      if (by && by.by !== D.me.name) toast(`${by.by}: ${by.what} ${qt(by.d)}`);
    } else if (!$('#layer').innerHTML) { $$('.sync span').forEach(s => s.textContent = syncText()); }
  } catch (e) { if (e.code === 'auth') logout(); else setSync('off'); }
  polling = false;
}
let PENDING_RENDER = false;
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(true); });

/* ---------- الحفظ (تفاؤلي مع التراجع عند الخطأ) ---------- */
async function saveAct(tid, patch, opt = {}) {
  const p = planOf(tid), body = Object.assign({}, patch);
  let idx = -1, prev = null, tmp = null;
  if (patch.id) { idx = p.acts.findIndex(a => a.id === patch.id); prev = p.acts[idx]; p.acts[idx] = Object.assign({}, prev, patch); }
  else { tmp = Object.assign({ id: 'tmp' + Date.now(), done: false, who: [], by: D.me.name, sem: semFor(tid, patch.d) || curN(tid) }, patch); p.acts.push(tmp); }
  if (patch.d && !patch.sem) { const s = semFor(tid, patch.d); if (s) body.sem = s; }
  if (!opt.quiet) render();
  setSync('busy');
  try {
    const r = await API.me('act_save', tid, JSON.stringify(body));
    const i = p.acts.findIndex(a => a.id === (patch.id || tmp.id));
    if (i >= 0) p.acts[i] = r.act; else p.acts.push(r.act);

/* ---------- السحب والإفلات (فأرة ولمس) ----------
   [data-drag] عنصر قابل للسحب (data-id، data-track). [data-drop] يوم (data-date، وdata-track إن قُيّد بمسار).
   .ltrack[data-lane] مسار ممتد: يُحسب اليوم من موضع المؤشر. اللمس: ضغطة مطوّلة ثم سحب. */
let DG = null, SUPPRESS = false;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const el = e.target.closest('[data-drag]'); if (!el || !canAdjust(el.dataset.track)) return;
  DG = { el, x: e.clientX, y: e.clientY, id: el.dataset.id, track: el.dataset.track, on: false, touch: e.pointerType === 'touch', pid: e.pointerId };
  if (DG.touch) DG.timer = setTimeout(() => { if (DG && !DG.on) { startDrag(DG.x, DG.y); if (navigator.vibrate) navigator.vibrate(12); } }, 320);
});
document.addEventListener('pointermove', e => {
  if (!DG) return;
  if (!DG.on) {
    const dist = Math.hypot(e.clientX - DG.x, e.clientY - DG.y);
    if (DG.touch) { if (dist > 10) { clearTimeout(DG.timer); DG = null; } return; }
    if (dist > 6) startDrag(e.clientX, e.clientY); else return;
  }
  e.preventDefault(); moveGhost(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('touchmove', e => { if (DG && DG.on) e.preventDefault(); }, { passive: false });
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && DG && DG.on) endDrag(e, true); });
function startDrag(x, y) {
  DG.on = true;
  const r = DG.el.getBoundingClientRect(), g = DG.el.cloneNode(true);
  g.classList.add('dragghost'); g.removeAttribute('data-drag'); g.style.width = Math.max(120, Math.min(240, r.width)) + 'px';
  document.body.appendChild(g); DG.g = g; DG.el.classList.add('drag-src');
  document.body.style.userSelect = 'none'; moveGhost(x, y);
}
function dropAt(x, y) {
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const lane = el.closest('.ltrack[data-lane]');
  if (lane) {
    const r = lane.getBoundingClientRect(), dw = +lane.dataset.dw, i = Math.floor((r.right - x) / dw);
    const n = +lane.dataset.n; if (i < 0 || i >= n) return null;
    return { el: lane, date: add(lane.dataset.start, i), track: lane.dataset.lane };
  }
  const d = el.closest('[data-drop]'); if (!d) return null;
  return { el: d, date: d.dataset.date, track: d.dataset.track || '' };
}
function moveGhost(x, y) {
  DG.g.style.left = (x - DG.g.offsetWidth / 2) + 'px'; DG.g.style.top = (y - 20) + 'px';
  const t = dropAt(x, y), ok = t && (!t.track || t.track === DG.track);
  if (DG.over && DG.over !== (ok && t.el)) DG.over.classList.remove('drop-on');
  if (ok && !t.el.matches('.ltrack')) { t.el.classList.add('drop-on'); DG.over = t.el; } else DG.over = null;
  DG.target = ok ? t : null;
  if (DG.g) { if (ok) DG.g.dataset.when = 'إلى ' + gDay(t.date); else delete DG.g.dataset.when; }
  const m = 60; if (y < m) scrollBy(0, -12); else if (y > innerHeight - m) scrollBy(0, 12);
}

  if (!DG) return;
  clearTimeout(DG.timer);
  if (DG.on) {

    DG.g.remove(); DG.el.classList.remove('drag-src'); if (DG.over) DG.over.classList.remove('drop-on');
    document.body.style.userSelect = '';
    if (!cancel && DG.target) moveAct(DG.track, DG.id, DG.target.date);
  }
  DG = null;
}

/* ---------- بطاقة النشاط ---------- */

/* ---------- الصحة الأسبوعية للمسار ---------- */
function semStartMin() { return D.tracks.map(t => semRange(t.id, curN(t.id))).filter(Boolean).map(r => r.from).sort()[0]; }

  const acts = actsOf(id).filter(a => a.d >= ws && a.d <= we).sort(sortA);
  if (!daysOf(id).length) return { k: 'grey', label: 'لا جدول للفصل بعد', acts };
  if (!ds.length) return { k: 'grey', label: TODAY < daysOf(id)[0].d ? 'يبدأ ' + gDay(daysOf(id)[0].d) : 'خارج الفصل', acts };
  if (!acts.length) return ds.some(d => d.c) ? { k: 'none', label: 'لا أنشطة في الخطة', acts } : { k: 'grey', label: 'إجازة أو اختبارات', acts };

const hlDot = h => `<span class="hl ${h.k}"><i></i><span class="lab ellip">${esc(h.label)}</span></span>`;

/* ---------- نبض المسارات: شريط لكل مسار مقسوم على أسابيع الفصل ---------- */

  const g0 = wkStart(ranges.map(r => r.from).sort()[0]), g1 = ranges.map(r => r.to).sort().pop();

  const head = Array.from({ length: n }, (_, i) => `<span class="${i === cur ? 'now' : ''}" data-tip="${gShort(add(g0, i * 7))} – ${gShort(add(g0, i * 7 + 6))}">${i + 1}</span>`).join('');

      else if (!study) cls += ' off'; else if (past) cls += ' past0';

/* ---------- خلاصة الفصل: التقدم، الأنواع، الأعضاء، الأسابيع الفارغة ---------- */
function semStats(id, n) {

  if (!weeks.length) return `<div class="card empty">${svg('table')}<p>تظهر الخلاصة حين يُضاف جدول الفصل.</p></div>`;
  const N = weeks.length, wIdx = a => { const w = weeks.findIndex(W => a.d >= W.from && a.d <= W.to); return w < 0 ? (a.d < weeks[0].from ? 0 : N - 1) : w; };
  const plan = Array(N).fill(0), done = Array(N).fill(0); acts.forEach(a => { plan[wIdx(a)]++; if (a.done) done[wIdx(a)]++; });
  let cp = 0, cd = 0; const P_ = plan.map(x => cp += x), D_ = done.map(x => cd += x);
  const nowI = weeks.findIndex(W => TODAY >= W.from && TODAY <= W.to), upto = nowI < 0 ? (TODAY > weeks[N - 1].to ? N - 1 : -1) : nowI;
  const W = 560, H = 190, padX = 26, padY = 18, max = Math.max(4, cp), x = i => W - padX - (i + .5) * (W - 2 * padX) / N, y = v => H - padY - v * (H - 2 * padY) / max;

    <text x="${W - padX}" y="${y(max) - 4}" text-anchor="end">${max}</text>
    ${area ? `<polygon class="area" points="${area}"/>` : ''}

    ${nowI >= 0 ? `<line class="nowl" x1="${x(nowI)}" x2="${x(nowI)}" y1="${padY - 6}" y2="${y(0)}"/>` : ''}
  </svg>`;

    <div class="card"><div class="card-h"><h3>توزيع المهام على الفريق</h3></div>${mem ? `<div class="bars">${mem}</div>` : '<p class="muted sm">لم يُسند شيء بعد.</p>'}</div>

function inlineEdit(btn) {

  inp.className = 'cell-in'; inp.value = old; inp.setAttribute('aria-label', { ax: 'المحور', c: 'المقرر', q: 'المقدار', r: 'المطلوب' }[k]);

function md(t) {   // تنسيق بسيط وآمن: عناوين، نقاط، ترقيم، عريض
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let h = '', list = '';
  const close = () => { if (list) { h += `</${list}>`; list = ''; } };
  String(t || '').split('\n').forEach(l => {
    const m = /^(#{1,3})\s+(.*)$/.exec(l), b = /^\s*[-•*]\s+(.*)$/.exec(l), n = /^\s*\d+[.)]\s+(.*)$/.exec(l);
    if (m) { close(); h += `<h${m[1].length + 2}>${inl(m[2])}</h${m[1].length + 2}>`; }
    else if (b) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inl(b[1])}</li>`; }
    else if (n) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inl(n[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); h += `<p>${inl(l)}</p>`; }
  });
  close(); return h;
}

  'bot-now': async () => { try { const r = await API.me('remind_now'); toast(r.sent ? (r.sent === 1 ? 'أُرسل تذكير واحد' : r.sent === 2 ? 'أُرسل تذكيران' : `أُرسلت ${r.sent} ${r.sent <= 10 ? 'تذكيرات' : 'تذكيرًا'}`) : 'لا شيء مستحق الآن'); if (r.errs && r.errs.length && r.errs[0] !== 'لا بوت') toast(r.errs[0], 'err'); BS = null; BS_LOAD = false; render(); } catch (e) { toast(e.message, 'err'); } },

  'bs-ph': el => { const ta = LAST_TA && document.contains(LAST_TA) ? LAST_TA : $('#bs-d3'); const s = ta.selectionStart || ta.value.length; ta.value = ta.value.slice(0, s) + el.dataset.v + ta.value.slice(ta.selectionEnd || s); ta.focus(); ta.selectionStart = ta.selectionEnd = s + el.dataset.v.length; updTgPrev(); },

// تأكيد بضغطتين للإجراءات التي لا رجعة فيها
function armed(el, label) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.innerHTML; el.innerHTML = esc(label); el.classList.add('danger');
  setTimeout(() => { if (document.contains(el)) { delete el.dataset.armed; el.innerHTML = old; } }, 4000);
  return false;
}
let SI = null, LAST_TA = null;
function tgOpen(el, e) { if (CFG.demo && window.DEMO) { e.preventDefault(); window.DEMO.simJoin(el.getAttribute('href')); toast('تجربة: كأنك اخترت المجموعة في تليجرام…'); } watchLink(); }
function keepTpl() { if (!BS || !BS.settings) return; const a = $('#bs-d3'), b = $('#bs-d1'), h = $('#bs-h'); if (a) BS.settings.tpl = { d3: a.value, d1: b.value }; if (h) BS.settings.remindHour = +h.value; }
function updTgPrev() { const p = $('#bs-prev'); if (p && BS) p.innerHTML = tgPreview(BS.settings, 'd3') + tgPreview(BS.settings, 'd1'); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const k = el.dataset.act, f = H[k]; if (!f) return;
  if (el.tagName === 'A' && (k === 'tgwatch' || k === 'tglink')) { f(el, e); return; }   // يفتح الرابط ويبدأ المتابعة
  if (el.tagName === 'A' && k === 'tlweek') e.preventDefault();
  if (el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && k !== 'tblq')) return;
  if (k === 'tblq') return;
  f(el, e);
});
document.addEventListener('change', e => { const el = e.target; if (el.id === 'ac-r' && $('#ac-tf')) $('#ac-tf').hidden = el.value === 'admin'; if (el.dataset.act === 'bot-assign' && el.value) API.me('tg_assign', el.dataset.chat, el.value).then(s => { BS = s; toast('رُبطت المجموعة ✓'); boot(true); }).catch(x => toast(x.message, 'err')); if (el.id === 'f-d' && F) { readF(); drawAct(true); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act === 'tblq') { TB.q = el.value; clearTimeout(TB.t); TB.t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('[data-act="tblq"]'); if (n) { n.focus(); n.selectionStart = n.selectionEnd = pos; } }, 180); }
  if (el.id === 'cmd-q') { CMD.q = el.value; CMD.i = 0; cmdUpdate(); }
  if (el.dataset.act === 'bs-tpl') updTgPrev();
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.act === 'bs-tpl') LAST_TA = e.target; });
document.addEventListener('submit', e => { if (e.target.id === 'lgf') { e.preventDefault(); doLogin(($('#lg-u').value || '').trim(), $('#lg-p').value); } });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K' || e.key === 'ك')) { if (D) { e.preventDefault(); CMD ? closeLayer() : openCmd(); } return; }
  if (CMD) {
    if (e.key === 'ArrowDown') { e.preventDefault(); CMD.i = Math.min(CMD.items.length - 1, CMD.i + 1); cmdUpdate(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); CMD.i = Math.max(0, CMD.i - 1); cmdUpdate(); }
    else if (e.key === 'Enter') { e.preventDefault(); cmdRun(CMD.i); }
    else if (e.key === 'Escape') { e.preventDefault(); closeLayer(); }
    return;
  }
  if (e.key === 'Escape' && $('#layer').innerHTML) { e.preventDefault(); closeLayer(); return; }
  if (e.key === 'Escape' && F && F.dock) { e.preventDefault(); closeAct(); return; }
  if (e.key === 'Tab' && $('#layer').innerHTML) trapFocus(e);
  if (e.key === 'Enter' && (e.target.id === 'pw-n' || e.target.id === 'pw-o')) { e.preventDefault(); const b = $('[data-act="pw-save"]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && F && e.target.id === 'f-whonew') { e.preventDefault(); const v = e.target.value.trim(); if (v) { readF(); F.who = [...new Set((F.who || []).concat(v))]; drawAct(true); setTimeout(() => $('#f-whonew') && $('#f-whonew').focus(), 50); } return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && F) { e.preventDefault(); saveF(); return; }

  else if (e.key === 't' || e.key === 'ف') { if (route().name === 'timeline') { P.tl.anchor = ''; savePrefs(); render(); } }
});
let MQ = isMob(), WQ = innerWidth >= WIDE_Q; addEventListener('resize', () => { const m = isMob(), w = innerWidth >= WIDE_Q; if (m !== MQ || w !== WQ) { MQ = m; WQ = w; if (F && F.dock) { readF(); F.dock = false; render(); drawAct(); return; } if (D && !$('#layer').innerHTML) render(); } });
