<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البوابة الإعلامية للبرامج الإلكترونية</title>

<meta name="theme-color" content="#2d4d24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:site_name" content="أكاديمية الجيل الصاعد">
<meta property="og:title" content="البوابة الإعلامية للبرامج الإلكترونية">
<meta property="og:description" content="صمّم إعلانات مسارك ونشاطك بهويتها الرسمية، وحمّلها بجودة عالية.">
<meta property="og:url" content="https://ghamine23.github.io/media-portal/">
<meta property="og:image" content="https://ghamine23.github.io/media-portal/og.png">

<style>
:root{
  --p:#467839; --pd:#2d4d24; --s:#654b37; --sd:#433125; --a:#fbb03b;
  --bg:#f3f1ed; --card:#ffffff; --ink:#26231f; --mut:#6f6a63; --line:#e3ded6; --soft:#f8f6f3;
  --r:14px; --f:'tj_r','JzBrand',"Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.top{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);color:var(--ink);position:sticky;top:0;z-index:8;box-shadow:0 1px 0 var(--line)}
.top .in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.top .mark img{height:34px;display:block}
.bt{display:flex;flex-direction:column;line-height:1.2}
.bt b{font-size:17px;color:#2a1534}
.bt small{font-size:12.5px;color:var(--mut)}
.bar4{display:flex;height:4px}.bar4 i{flex:1}.bar4 i:nth-child(1){background:#f45905}.bar4 i:nth-child(2){background:#c70d3a}.bar4 i:nth-child(3){background:#512c62}.bar4 i:nth-child(4){background:#16817a}
#userbox{display:flex;gap:8px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 14px;cursor:pointer;font-size:14px}
.tbtn:hover{border-color:var(--p)}
.tbtn .q{width:22px;height:22px;border-radius:50%;background:var(--pt);color:var(--p);display:grid;place-items:center;font-weight:700}
.tbtn .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#512c62,#16817a);color:#fff;display:grid;place-items:center;font-weight:700}
#main{max-width:1240px;margin:0 auto;padding:20px 20px 60px}
#boot{display:grid;place-items:center;min-height:60vh;color:var(--mut)}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.25;margin:0 0 10px;color:var(--sd)}
.hero p{max-width:640px;color:var(--mut);margin:0;font-size:17px}
.h{font-size:20px;margin:28px 0 14px;color:var(--sd)}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.track{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}
.track:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(60,40,20,.08)}
.track canvas{width:100%;height:auto;background:var(--soft);border-radius:12px}
.track .tn{display:flex;justify-content:space-between;align-items:baseline}
.track .tn b{font-size:20px}
.track .tn span{color:var(--mut);font-size:14px}
.track .sw{display:flex;gap:6px}
.track .sw i{width:26px;height:10px;border-radius:5px}
.track.soon{border-style:dashed;background:transparent;justify-content:center;align-items:center;text-align:center;color:var(--mut);min-height:160px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin:4px 0 6px}
.crumbs a{text-decoration:none;border-bottom:1px solid transparent}
.crumbs a:hover{border-color:currentColor}
.crumbs b{color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.chip{flex:none;display:flex;gap:8px;align-items:center;text-decoration:none;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px}
.chip small{background:var(--soft);border-radius:999px;padding:0 8px;font-size:12px;color:var(--mut)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip.on small{background:rgba(255,255,255,.2);color:#fff}
.tydesc{color:var(--mut);margin:4px 0 16px;font-size:15px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(60,40,20,.10)}
.thumb{background:#e9e5df;display:grid;place-items:center;aspect-ratio:4/5;padding:14px}
.thumb canvas{max-width:100%;max-height:100%;height:auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tmeta{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tmeta b{font-size:17px}
.tmeta span{color:var(--mut);font-size:13px}
.editor{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start;margin-top:10px}
.side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 18px 18px}
.side .h{margin:14px 0 8px;font-size:18px}
.view{position:sticky;top:80px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 92px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-bottom:4px}
.stage{background:#e4dfd8;border-radius:18px;padding:18px;display:grid;place-items:center;height:max(340px,calc(100vh - 330px));flex:0 0 auto}
.ied{position:absolute;z-index:8;background:#fff;border:1.5px solid #2f7de0;border-radius:14px;box-shadow:0 14px 34px rgba(30,40,60,.22);padding:10px;display:flex;flex-direction:column;gap:6px;animation:iedIn .18s ease-out}
.ied small{color:var(--mut);font-size:12.5px}
.ied textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;line-height:1.6;resize:none;background:var(--soft);min-height:42px}
.ied textarea:focus{outline:2px solid #2f7de0;outline-offset:0;background:#fff}
.iedf{display:flex;align-items:center;justify-content:space-between;gap:8px}.iedf span{font-size:12px;color:var(--mut)}
@keyframes iedIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.gsrow{display:flex;flex-direction:column;gap:4px;margin-top:6px}.gsrow small{color:var(--mut)}
.range .pct{min-width:44px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.nbadge.shb{background:#2f7de0;color:#fff}
@media (max-width:900px){.ied{position:fixed;left:8px;right:8px;top:calc(64px + 38vh + 8px);z-index:60;max-height:40vh;overflow:auto}}
.pv{max-width:100%;max-height:calc(max(360px,calc(100vh - 300px)) - 36px);width:auto;height:auto;box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:4px;touch-action:none}
.pv.drag{cursor:grabbing}
.opts{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt>label,.fld>label,.lab label{font-size:13px;color:var(--mut)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--p);font-weight:700}
.range{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.range input{width:150px;accent-color:var(--p)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:12px 20px;border-radius:12px;cursor:pointer;font-size:16px}
.btn svg{width:20px;height:20px}
.btn.main{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.btn:hover{filter:brightness(.97)}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.tcard:focus-visible,.track:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.tip{color:var(--mut);font-size:13px;margin:0}
.fields{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cnt{font-size:11px;color:#a59f97;direction:ltr}
.cnt.over{color:#c0570f;font-weight:700}
.fld input[type=text],.fld textarea,.fld input[type=date],.fld select{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;transition:border-color .15s,background .15s}
.fld textarea{resize:vertical;min-height:70px;line-height:1.6}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--p);background:#fff}
.fld small{color:var(--mut);font-size:12px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.datebox{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.daterow{display:grid;grid-template-columns:1fr 130px;gap:8px}
.datebox input,.datebox select{background:#fff!important}
.tog{flex-direction:row;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog i{width:42px;height:24px;border-radius:12px;background:#d6d0c7;position:relative;flex:none;transition:background .15s}
.tog i:after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:right .15s}
.tog input:checked+i{background:var(--p)}
.tog input:checked+i:after{right:21px}
.tog input:focus-visible+i{outline:3px solid var(--a);outline-offset:2px}
.lib{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lib button{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:#ece8e2 center/cover no-repeat;cursor:pointer;font-size:12px;color:var(--mut);padding:2px}
.lib button.on{border-color:var(--p);box-shadow:0 0 0 2px rgba(70,120,57,.25)}
.lib .up{border-style:dashed}
.imgctl{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.link{border:0;background:none;color:var(--p);cursor:pointer;padding:0;text-decoration:underline;font-size:inherit}
.reset{padding-top:6px;border-top:1px solid var(--line);font-size:13px}
.saved{position:fixed;inset:0;background:rgba(20,15,10,.55);display:grid;place-items:center;z-index:20;padding:20px}
.sv{background:#fff;border-radius:18px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:92vh}
.sv b{font-size:18px}
.sv p{margin:0;color:var(--mut);font-size:14px}
.sv img{max-width:100%;max-height:52vh;object-fit:contain;border-radius:8px;background:#eee}

.navbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 6px}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;font-size:14px}
.back:hover{border-color:var(--p);color:var(--p)}
.navbar .crumbs{margin:0}
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0 12px}
.ghead .h{margin:0}
.search{width:min(360px,100%);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-size:15px;outline:none}
.search:focus{border-color:var(--p)}
.group{margin-bottom:26px}
.group h3{font-size:18px;margin:6px 0 12px;display:flex;align-items:baseline;gap:10px;color:var(--sd)}
.group h3 span{font-size:13px;color:var(--mut);font-weight:400}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -18px 14px;padding:0 10px;position:sticky;top:64px;background:var(--card);z-index:2;border-radius:18px 18px 0 0;overflow-x:auto}
.tabs button{border:0;background:none;padding:14px 12px 11px;cursor:pointer;font-size:15px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--p);border-bottom-color:var(--p);font-weight:700}
.sh{font-size:15px;margin:16px 0 4px;color:var(--sd)}
.sh:first-child{margin-top:4px}
.note{color:var(--mut);font-size:12.5px;margin:0 0 10px;line-height:1.6}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pal{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;cursor:pointer;font-size:14px}
.pal.on{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(70,120,57,.15)}
.dots{display:flex}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-inline-start:-6px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.dots i:first-child{margin-inline-start:0}
.crow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--soft)}
.clab{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.auto{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 12px;font-size:12px;cursor:pointer;color:var(--mut)}
.auto.on{background:var(--p);border-color:var(--p);color:#fff}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.swt{width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;position:relative}
.swt.on{outline:3px solid var(--a);outline-offset:1px}
.swt.more{display:grid;place-items:center;background:conic-gradient(#e44,#fd3,#4c4,#3cf,#44e,#c4c,#e44);color:#fff;font-weight:700;text-shadow:0 0 3px #000;overflow:hidden}
.swt.more input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fnt{border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fnt .smp{font-size:22px;line-height:1.5}
.fnt small{color:var(--mut);font-size:12px}
.fnt.on{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(70,120,57,.15)}
.seg.wrap{flex-wrap:wrap}
.labr{display:flex;align-items:center;gap:8px}
.eye{border:0;background:none;cursor:pointer;color:var(--mut);padding:2px;display:grid;place-items:center;border-radius:6px}
.eye svg{width:18px;height:18px}
.eye .slash{display:none}
.eye.off{color:#c0570f}
.eye.off .slash{display:inline}
.eye:hover{background:var(--soft)}
.fld.hid input[type=text],.fld.hid textarea,.fld.hid .lib{opacity:.4}
.imgf .lab{margin-bottom:2px}
.togs{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.actions .sp{flex:1}
.btn .sm{display:none}
.btn.icon{padding:10px 12px}
.btn.icon svg{width:22px;height:22px}
.btn:disabled{opacity:.35;cursor:default}

.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0 6px}
.entry{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;transition:transform .15s,box-shadow .15s}
.entry:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(60,40,20,.08);border-color:var(--p)}
.entry canvas{flex:none;background:var(--soft);border-radius:12px}
.entry b{display:block;font-size:17px}
.entry span{color:var(--mut);font-size:13px;line-height:1.5}
.stage{position:relative}
.ovl{position:absolute;pointer-events:none}
.selbar{background:var(--card);border:1.5px solid #2f7de0;border-radius:16px;padding:10px 14px}
.sbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sbh .x{border:0;background:var(--soft);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.sbt{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sbcol{display:flex;flex-direction:column;gap:6px}
.sbcol.grow{flex:1;min-width:220px}
.sbcol small{color:var(--mut);font-size:12px}
.pos9{display:grid;grid-template-columns:repeat(3,32px);gap:4px}
.pos9 button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);cursor:pointer;font-size:15px;background:#eef6ea;color:var(--pd)}
.pos9 button.clash{background:#fbeee6;color:#c0570f}
.pos9 button:hover{border-color:var(--p)}
.sbrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px}
.mini:hover{border-color:var(--p);color:var(--p)}
.mini.danger:hover{border-color:#c0392b;color:#c0392b}
.warn{color:#b4531a;font-size:13px;margin:0;background:#fdf1e8;border-radius:8px;padding:6px 10px}
.selbar textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft);font-size:15px}
.swt.orig{background:linear-gradient(135deg,#467839 50%,#654b37 50%);color:#fff;font-size:10px}
.libgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.libgrid.wide{grid-template-columns:repeat(3,1fr)}
.libit{aspect-ratio:1;border:1.5px solid var(--line);border-radius:10px;background:var(--soft) center/contain no-repeat;cursor:pointer;padding:4px;display:grid;place-items:center;overflow:hidden}
.libit canvas{max-width:100%;max-height:100%}
.libit.wide{aspect-ratio:2/1;background-size:70%}
.libit.photo{background-size:cover}
.libit.up{border-style:dashed;color:var(--mut);font-size:13px}
.libit.bgp{aspect-ratio:auto;padding:4px;gap:2px}
.libit.bgp small{font-size:11px;color:var(--mut)}
.libit.on{border-color:var(--p);box-shadow:0 0 0 2px rgba(70,120,57,.25)}
.libit:hover,.libtxt:hover{border-color:var(--p)}
.libtxt{grid-column:span 2;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer;padding:12px;font-size:15px}
.libtxt.big{font-size:20px;font-weight:700}
.llist{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.lrow.on{border-color:#2f7de0}
.lname{border:0;background:none;cursor:pointer;flex:1;text-align:right;font-size:14px}
.skels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skel{border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.skel canvas{width:100%;height:auto;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.skel small{font-size:12px}
.skel:hover{border-color:var(--p)}
.tips{display:flex;flex-direction:column;gap:8px}
.tip1{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft)}
.tip1 p{margin:0 0 6px;font-size:14px;line-height:1.6}
.gens{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
