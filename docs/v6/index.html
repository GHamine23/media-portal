<style>
/* الهوية على طريقة موقع المرجع: أبيض ورمادي وأسود، عناوين ثمانية سيريف، بطاقات بحواف واسعة، وحركة هادئة */
:root{
  --bg:#ffffff; --bg2:#f7f7f7; --bg3:#f4f4f5; --card:#ffffff;
  --ink:#0a0a0a; --ink1:#171717; --ink2:#5e5e5e; --ink3:#707070; --mute:#999999; --line:#ececec; --line2:#d6d6d6;
  --or:#f88833; --or-t:rgba(248,136,51,.1); --pu:#6d60fc; --pu-t:rgba(109,96,252,.1); --bl:#1a71fd; --bl-t:rgba(26,113,253,.1); --gr:#36a660; --gr-t:rgba(54,166,96,.1);
  --rd:#d64545; --rd-t:rgba(214,69,69,.1); --sel:#1a71fd;
  --fd:'thm-display','Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;
  --ft:'thm-text','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;
  --fs:'thm-sans','Segoe UI',Tahoma,sans-serif;
  --r1:12px; --r2:20px; --r3:28px;
  --sh1:rgba(0,0,0,.18) 0 .6px .6px -1.25px, rgba(0,0,0,.16) 0 2.3px 2.3px -2.5px, rgba(0,0,0,.06) 0 10px 10px -3.75px;
  --sh2:rgba(0,0,0,.08) 0 1px 2px, rgba(0,0,0,.08) 0 12px 32px -8px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.3,.64,1); --k:1.25;
  --top:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink1);font-family:var(--ft);font-size:17px;line-height:1.65}
body.app{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--ac,#000);color:#fff}
:focus-visible{outline:2px solid var(--ac,var(--sel));outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--fd);font-weight:500;margin:0;line-height:1.25;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(34px,5.4vw,56px);font-weight:700}
h2{font-size:clamp(26px,3.6vw,40px)}
h3{font-size:22px}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:15px} .tiny{font-size:13px;color:var(--ink3)}
.eyebrow{font-family:var(--ft);font-size:15px;color:var(--ink2)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}
/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:10px 20px;font-family:var(--ft);font-weight:500;font-size:16px;
  background:var(--bg3);color:var(--ink1);transition:transform .25s var(--ease),background .2s,box-shadow .25s;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{background:#ebebec}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ac,#000);color:#fff}
.btn.dark:hover{background:var(--ac2,#262626)}
.btn.line{background:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.line:hover{background:var(--bg2)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.danger{background:var(--rd-t);color:var(--rd)}
.btn.sm{padding:7px 14px;font-size:14.5px}
.btn.lg{padding:14px 28px;font-size:17px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg,.ib svg{width:18px;height:18px;flex:none}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--ink1);transition:background .2s,transform .2s var(--ease)}
.ib:hover{background:var(--bg3)} .ib:active{transform:scale(.92)} .ib:disabled{opacity:.35;pointer-events:none}
.ib.on{background:var(--ac,#000);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:13.5px;background:var(--bg3);color:var(--ink2)}
.pill.or{background:var(--or-t);color:#b35a14}.pill.pu{background:var(--pu-t);color:#4b3fd6}.pill.bl{background:var(--bl-t);color:#1559c7}.pill.gr{background:var(--gr-t);color:#26804a}.pill.rd{background:var(--rd-t);color:#b23a3a}
/* حقول */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lab{font-size:14.5px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.inp,.fld input[type=text],.fld input[type=email],.fld input[type=password],.fld input[type=search],.fld input[type=date],.fld input[type=number],.fld textarea,.fld select{
  width:100%;border:1px solid var(--line2);background:#fff;border-radius:var(--r1);padding:11px 14px;font-size:16px;transition:border-color .2s,box-shadow .2s;outline:none}
.inp:focus,.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ac,#000);box-shadow:0 0 0 3px var(--ac-t,rgba(0,0,0,.06))}
.fld textarea{resize:vertical;min-height:46px;line-height:1.6}
.fld small{color:var(--ink3);font-size:13px}
.err{color:var(--rd);font-size:14.5px}
.ok{color:var(--gr);font-size:14.5px}
.seg{display:inline-flex;background:var(--bg3);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-size:14.5px;color:var(--ink2);transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ac-ink,var(--ink));box-shadow:var(--sh1)}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tog input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:background .2s;margin:0;flex:none;cursor:pointer}
.tog input::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.tog input:checked{background:var(--ac,#000)}.tog input:checked::after{transform:translateX(-16px)}
/* بطاقات */
.card{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh1);padding:22px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.section{background:var(--bg2);border-radius:var(--r3);padding:clamp(20px,4vw,40px)}
.icon-tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-tile svg{width:22px;height:22px}
.t-or{background:var(--or-t);color:var(--or)}.t-pu{background:var(--pu-t);color:var(--pu)}.t-bl{background:var(--bl-t);color:var(--bl)}.t-gr{background:var(--gr-t);color:var(--gr)}.t-ink{background:var(--bg3);color:var(--ink1)}
.grid{display:grid;gap:16px}
.hover-lift{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.hover-lift:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
/* الرأس */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-bottom-color:var(--line)}
.top .in{height:var(--top);display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;text-decoration:none;flex:none}
.logo img{height:30px;display:block}
.nav{display:flex;gap:4px;align-items:center;margin-inline-start:12px}
.nav a{text-decoration:none;color:var(--ink2);font-size:15.5px;padding:7px 12px;border-radius:99px;transition:color .2s,background .2s}
.nav a:hover{color:var(--ink)} .nav a.on{color:var(--ac-ink,var(--ink));background:var(--ac-t,var(--bg3))}
.top .sp{flex:1}
.prog-sw{display:flex;align-items:center;gap:8px;border:0;background:var(--bg3);border-radius:99px;padding:6px 8px 6px 14px;font-size:14.5px;max-width:240px}
.prog-sw i{width:10px;height:10px;border-radius:50%;flex:none}
.prog-sw span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ac,#000);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-size:16px;border:0;flex:none}
.dot-badge{position:relative}
.dot-badge::after{content:"";position:absolute;top:7px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--or);box-shadow:0 0 0 2px #fff;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.banner{background:linear-gradient(90deg,var(--ac2,#000),var(--ac,#000));color:#fff;font-size:15px}
.banner .in{display:flex;align-items:center;gap:12px;padding-block:9px}
.banner b{font-family:var(--fd);font-weight:500}
.banner .x{margin-inline-start:auto;background:transparent;border:0;color:#fff;opacity:.7}
#view{min-height:calc(100vh - var(--top));view-transition-name:main}
/* الحركة: ظهور الكلمات من ضبابية، وظهور العناصر عند الوصول إليها */
.bw{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.25em);transition:opacity calc(.8s*var(--k)) var(--ease),filter calc(.8s*var(--k)) var(--ease),transform calc(.8s*var(--k)) var(--ease);transition-delay:calc(var(--i)*55ms)}
.in-view .bw,.bw.in{opacity:1;filter:none;transform:none}
.rv{opacity:0;transform:translateY(18px);filter:blur(6px);transition:opacity calc(.9s*var(--k)) var(--ease),transform calc(.9s*var(--k)) var(--ease),filter calc(.9s*var(--k)) var(--ease);transition-delay:calc(var(--d,0)*70ms)}
.rv.in-view{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.bw,.rv{opacity:1!important;filter:none!important;transform:none!important;transition:none!important}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::view-transition-old(main){animation:vtOut .22s var(--ease) both}
::view-transition-new(main){animation:vtIn .45s var(--ease) both}
@keyframes vtOut{to{opacity:0;filter:blur(4px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
/* رسائل ونوافذ */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:#000;color:#fff;padding:11px 20px;border-radius:99px;font-size:15px;z-index:200;opacity:0;transition:opacity .3s,transform .5s var(--spring);max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--sh2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:120;background:rgba(10,10,10,.28);display:grid;place-items:center;padding:16px;animation:fadeIn .25s ease both;backdrop-filter:blur(2px)}
.modal .box{background:#fff;border-radius:var(--r3);box-shadow:0 30px 80px -20px rgba(0,0,0,.35);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:28px;display:flex;flex-direction:column;gap:16px;animation:popIn .45s var(--spring) both}
.modal .box.wide{width:min(880px,100%)}
.modal .box h3{font-size:24px}
.modal .acts{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;margin-top:4px}
.modal .xbtn{position:absolute;top:14px;left:14px}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.skel{background:linear-gradient(90deg,var(--bg3) 0%,#fafafa 50%,var(--bg3) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:var(--r2)}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{color:var(--ink3);padding:30px 10px;text-align:center}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:#000;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
/* الجولة التعريفية */
.coach{position:fixed;inset:0;z-index:150;pointer-events:none}
.coach .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(10,10,10,.45);transition:all .55s var(--ease);pointer-events:none}
.coach .tip{position:fixed;background:#fff;border-radius:var(--r2);box-shadow:var(--sh2);padding:18px;width:min(320px,calc(100vw - 32px));pointer-events:auto;transition:all .55s var(--ease)}
.coach .tip h4{font-size:19px;margin-bottom:6px}
.coach .tip .acts{display:flex;gap:8px;margin-top:12px;align-items:center}
.coach .tip .n{margin-inline-start:auto;font-size:13px;color:var(--ink3)}
/* القوائم المنسدلة */
.menu{position:fixed;z-index:140;background:#fff;border-radius:16px;box-shadow:0 20px 50px -12px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.04);padding:6px;min-width:220px;animation:popIn .3s var(--spring) both}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:9px 12px;border-radius:10px;text-align:right;font-size:15px;text-decoration:none;color:var(--ink1)}
.menu button:hover,.menu a:hover{background:var(--bg3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .hd{padding:10px 12px 6px;font-size:13px;color:var(--ink3)}
.menu i.sw{width:10px;height:10px;border-radius:50%}
.menu svg{width:18px;height:18px;flex:none;color:var(--ink2)}
:where(button,a,span,div,label,b,li) > svg[viewBox="0 0 24 24"]{width:18px;height:18px;flex:none}
@media (max-width:860px){.nav{display:none}.top .in{gap:8px}.prog-sw{max-width:150px}}
</style>
<style>
/* ===== لون الواجهة (تضبطه applyAccent؛ هذه القيم الافتراضية قبل تشغيل السكربت) ===== */
:root{--ac:#4f46e5;--ac2:#3d36b2;--ac3:#7b74ec;--ac-t:rgba(79,70,229,.10);--ac-t2:rgba(79,70,229,.18);--ac-ink:#372fa0;--ac-soft:#f1f0fd;--ac-bg:#f2f2f9}
/* ===== الصفحات ===== */
.page{padding-block:34px 80px;display:flex;flex-direction:column;gap:22px}
.phead{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.sp{flex:1}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:6px 0 14px}
.kv dt{color:var(--ink3);font-size:14.5px}.kv dd{margin:0}
.sh{margin-top:12px}
.linkbtn{border:0;background:none;color:var(--ink2);font-size:14.5px;text-decoration:underline;text-underline-offset:3px;padding:4px;align-self:center}
.hide-s{}
@media (max-width:700px){.hide-s{display:none!important}}

/* ===== الدخول ===== */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:#fff}
.login.one{grid-template-columns:1fr}
.lgside{background:var(--bg2);position:relative;overflow:hidden;display:grid;place-items:center;min-height:300px}
.lgmain{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px max(24px,6vw);max-width:620px;width:100%;margin-inline:auto}
.lglogo img{height:clamp(88px,12vw,128px);display:block}
.login.one .lglogo img{height:52px}
.lgh{font-size:clamp(32px,4.6vw,48px)}
.lgcard{padding:26px}
.lgform{display:flex;flex-direction:column;gap:16px}
.pwrow{position:relative}.pwrow input{padding-left:46px}.pwrow .ib{position:absolute;left:4px;top:50%;transform:translateY(-50%)}
.pwbar{display:flex;gap:4px;margin-top:4px}.pwbar i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.pwbar i.on.s1{background:#e5a14a}.pwbar i.on.s2{background:#d8c14a}.pwbar i.on.s3,.pwbar i.on.s4{background:var(--gr)}
.fcards{position:relative;width:min(520px,80%);aspect-ratio:1/1.05}
.fc{position:absolute;width:44%;aspect-ratio:4/5;border-radius:22px;background:var(--bg);box-shadow:0 30px 60px -24px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.03);transform:rotate(var(--r));
  animation:fcIn 1.4s var(--ease) both,fcFloat 9s ease-in-out infinite;animation-delay:calc(var(--d)*.12s),calc(1.4s + var(--d)*.6s);padding:14% 12%;display:flex;flex-direction:column;gap:8%}
.fc i{display:block;height:7%;border-radius:99px;background:var(--fg);opacity:.9}.fc .l2{width:70%;opacity:.45}.fc .l3{width:50%;opacity:.25;margin-top:auto}
.fc b{position:absolute;left:12%;bottom:10%;width:22%;aspect-ratio:1;border-radius:50%;background:var(--fg);opacity:.85}
.fc0{top:6%;right:8%}.fc1{top:20%;left:6%}.fc2{top:46%;right:26%}.fc3{bottom:2%;left:14%}.fc4{top:2%;left:34%;width:30%}
@keyframes fcIn{from{opacity:0;transform:translateY(60px) rotate(0) scale(.92);filter:blur(10px)}}
@keyframes fcFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}
.boot{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.bootlogo{height:46px}
.bootbar{width:180px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}.bootbar i{display:block;height:100%;width:40%;background:var(--ac);border-radius:3px;animation:bootbar 1.2s var(--ease) infinite}
@keyframes bootbar{from{transform:translateX(160%)}to{transform:translateX(-260%)}}
@media (max-width:860px){.login{grid-template-columns:1fr}.lgside{display:none}.lgmain{padding-top:56px}}

/* ===== الرئيسية ===== */
.hero{padding-block:clamp(36px,7vw,84px) 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.hero h1{max-width:820px}
.searchrow{display:flex;align-items:center;gap:10px;width:min(640px,100%);background:#fff;border-radius:99px;padding:6px 20px;box-shadow:var(--sh1),0 0 0 1px var(--line);transition:box-shadow .3s}
.searchrow:focus-within{box-shadow:var(--sh2),0 0 0 2px var(--ac)}
.searchrow svg{width:20px;height:20px;color:var(--ink3)}
.hsearch{flex:1;border:0;outline:0;font-size:17px;padding:10px 0;background:transparent}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;margin-top:22px;background:var(--bg2);border-radius:var(--r3);padding:14px}
.qcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r2);padding:18px;text-decoration:none;text-align:right;box-shadow:var(--sh1)}
.qcard b{display:block;font-family:var(--fd);font-weight:500;font-size:19px;color:var(--ink)}
.qcard span:not(.icon-tile){display:block;font-size:14px;color:var(--ink2);line-height:1.5}
.hsec{margin-top:46px;display:flex;flex-direction:column;gap:18px}
.shead{display:flex;align-items:end;justify-content:space-between;gap:12px}

/* ===== شاشة الترحيب عند الفتح ===== */
#splash{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:radial-gradient(120% 90% at 85% 10%,#fff4e8 0%,#f7f7f7 45%,#eef0ff 100%);overflow:hidden;transition:opacity .55s var(--ease),visibility .55s}
#splash.off{opacity:0;visibility:hidden;pointer-events:none}
#splash .so{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:soFloat 9s ease-in-out infinite alternate}
#splash .so1{width:42vmax;height:42vmax;background:#ffd9b8;inset:auto auto -12vmax -10vmax}
#splash .so2{width:34vmax;height:34vmax;background:#d8d0ff;inset:-10vmax -8vmax auto auto;animation-delay:-3s}
#splash .so3{width:22vmax;height:22vmax;background:#cfeee9;inset:30% auto auto 20%;animation-delay:-6s;opacity:.4}
@keyframes soFloat{to{transform:translate(6vmax,-4vmax) scale(1.12)}}
.splash-in{position:relative;display:grid;justify-items:center;gap:8px;text-align:center;animation:spIn .9s var(--ease) both}

.splash-mark::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(0,0,0,.08);border-top-color:var(--ac);animation:spRing 1.4s linear infinite}
.splash-mark::after{content:'';position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(242,158,76,.35),transparent 70%);animation:spPulse 2.6s ease-in-out infinite;z-index:-1}
@keyframes spMark{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(-3deg)}}
@keyframes spRing{to{transform:rotate(360deg)}}
@keyframes spPulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.splash-word{font-family:var(--fd,var(--ft));font-size:44px;font-weight:800;letter-spacing:-.5px;margin-top:14px;line-height:1}

/* الزر المشغول والمنتهي */
.btn.pending,.ib.pending{pointer-events:none;cursor:progress;opacity:.8}

#morecue{position:fixed;left:0;right:0;bottom:0;height:96px;z-index:28;pointer-events:none;opacity:0;transition:opacity .35s var(--ease);background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.92) 70%)}

/* المصمّم الذكي: مراحل الانتظار، «فهم المساعد»، بطاقة الاقتراح بزر «عدّل»، وشارة «الأنسب» */
.mkwait2{max-width:560px;margin:10px auto;padding:26px 28px;display:flex;flex-direction:column;gap:14px}
.mksteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mksteps li{display:flex;align-items:center;gap:12px;color:var(--mut,#707070);font-size:16px;transition:color .4s var(--ease)}
.mksteps li i{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg2,#f2f2f2);border:1.5px solid var(--line2,#d6d6d6);transition:background .4s var(--ease),border-color .4s var(--ease)}
.mksteps li i svg{width:15px;height:15px}
.mksteps li.done{color:var(--ink,#171717)}

.mkcard{cursor:pointer}

.cwday{border:0;background:transparent;font:inherit;color:inherit;text-align:right;padding:2px 4px;margin:-2px -4px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px;transition:background .2s}

.calmini .prow6 span.cst{width:26px;height:26px;border-radius:8px}
/* تفاصيل منشور: بلا صورة، عمود واحد */
.pdgrid{grid-template-columns:1fr;gap:12px}
.pdgone{display:flex;align-items:flex-start;gap:6px;background:var(--ac-soft);color:var(--ac-ink);border-radius:10px;padding:8px 10px;margin:0}
.pdgone svg{width:15px;height:15px;flex:none;margin-top:2px}
/* محرر التكرار داخل المهمة: ملخصه الخاص تحته */
.taskrep .repsum{display:none}

/* ---------- عرض اليوم ---------- */
.dvwrap{display:flex;flex-direction:column;gap:10px}
.dvstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dvsd{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:7px 2px 6px;font:inherit;color:var(--ink1);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:background .2s,box-shadow .2s,transform .2s var(--spring)}
.dvsd small{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dvsd b{font-family:var(--fd);font-weight:500;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums}
.dvsd i{width:5px;height:5px;border-radius:50%;background:transparent}.dvsd i.on{background:var(--ac3)}
.dvsd:hover{transform:translateY(-1px)}
.dvsd.today b{color:var(--ac)}
.dvsd.fri small{color:#c25a12}
.dvsd.on{background:var(--ac);box-shadow:none;color:#fff}.dvsd.on small{color:rgba(255,255,255,.8)}.dvsd.on b{color:#fff}.dvsd.on i.on{background:#fff}
.dvall{display:flex;align-items:flex-start;gap:8px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:8px 10px}
.dvall > .dvlab{min-width:52px;flex:none;padding-top:5px;color:var(--ink3);white-space:nowrap}
.dvalli{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.dvadd{border:0;background:transparent;color:var(--ink3);font:inherit;display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;cursor:pointer;transition:background .2s,color .2s}
.dvadd:hover{background:var(--bg3);color:var(--ac)}.dvadd svg{width:14px;height:14px}
.dvempty{text-align:center;color:var(--ink3);margin:0}
.dvbox{background:#fff;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.dvscroll{height:clamp(360px,calc(100vh - 330px),780px);overflow-y:auto;overscroll-behavior:contain;position:relative;
  --fade:linear-gradient(to bottom,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.dvscroll.mtop.mbot{-webkit-mask-image:var(--fade);mask-image:var(--fade)}
.dvscroll.mtop:not(.mbot){-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22px);mask-image:linear-gradient(to bottom,transparent,#000 22px)}
.dvscroll.mbot:not(.mtop){-webkit-mask-image:linear-gradient(to top,transparent,#000 22px);mask-image:linear-gradient(to top,transparent,#000 22px)}
.dvscroll.dragging{cursor:grabbing}
.dvgrid{position:relative;cursor:copy}
.dvh{position:absolute;inset-inline:0;height:var(--hh);border-top:1px solid var(--line);pointer-events:none}
.dvh:first-child{border-top:0}
.dvh .dvlab{position:absolute;inset-inline-start:8px;top:-9px;width:44px;background:#fff;color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums;padding-inline-end:4px}
.dvh::after{content:'';position:absolute;inset-inline:60px 0;top:50%;border-top:1px dashed #f2f2f2}
.dvgrid:hover .dvh::after{border-top-color:#ececec}
.dvnow{position:absolute;inset-inline:56px 0;height:0;border-top:2px solid var(--rd);z-index:3;pointer-events:none}
.dvnow i{position:absolute;inset-inline-start:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--rd)}
.dvev{position:absolute;--lane:0;--lanes:1;inset-inline-start:calc(62px + (100% - 70px) * var(--lane) / var(--lanes));width:calc((100% - 70px) / var(--lanes) - 4px);
  display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;padding:2px 8px;border-radius:9px;font-size:13px;line-height:1.3;cursor:pointer;z-index:2;
  background:var(--bl-t);color:var(--ink1);border-inline-start:3px solid var(--bl);transition:box-shadow .2s,transform .2s var(--spring),opacity .2s;box-sizing:border-box}
.dvev:hover{box-shadow:var(--sh1);z-index:4}
.dvev b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvev .dvt{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.dvev svg.cst{width:13px;height:13px;flex:none;color:var(--bl)}
.dvev.post.sent{background:var(--gr-t);border-color:var(--gr)}.dvev.post.sent svg.cst{color:var(--gr)}
.dvev.post.failed{background:var(--rd-t);border-color:var(--rd)}.dvev.post.failed svg.cst{color:var(--rd)}
.dvev.post.cancelled{background:var(--bg3);border-color:var(--line2);opacity:.65}.dvev.post.cancelled b{text-decoration:line-through}
.dvev.task{background:var(--or-t);border-color:var(--or)}
.dvev.task.high{background:rgba(248,136,51,.2)}
.dvev.task.done{opacity:.55}.dvev.task.done b{text-decoration:line-through}
.dvev .tchk{width:17px;height:17px}.dvev .tchk svg{width:10px;height:10px}
.dvev .cmore6{width:24px;height:24px;margin-inline-end:-4px}
.dvev .tiny{flex:none;color:var(--ink3)}
.dvev.allday{position:static;width:auto;max-width:100%;padding:5px 9px}
.dvev.movable{cursor:grab}
.dvev.dragging{cursor:grabbing;box-shadow:0 10px 26px rgba(20,18,40,.18);transform:scale(1.02);z-index:6;transition:box-shadow .2s,transform .2s var(--spring)}
.dvev.saving{opacity:.6;animation:dvpulse 1s var(--ease) infinite alternate}
@keyframes dvpulse{to{opacity:.35}}
.dvtip{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:var(--ac);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
/* ---------- أدوات القائمة: البحث والمدى والبرنامج والتصدير ---------- */
.cltools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.clsearch{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line2);padding:0 12px;flex:1 1 220px;min-width:0;max-width:420px}
.clsearch svg{width:16px;height:16px;color:var(--ink3);flex:none}
.clsearch .inp{border:0;background:transparent;box-shadow:none;padding-inline:0;flex:1;min-width:0;width:auto}
.clsearch:focus-within{box-shadow:inset 0 0 0 1.5px var(--ac)}
.cltools .inp.sm{width:auto}
@media (max-width:700px){
  .cchip .tchk{display:none}
  .dvstrip{gap:3px}.dvsd{border-radius:12px;padding:6px 0 5px}.dvsd small{font-size:10.5px}.dvsd b{font-size:16px}
  .dvscroll{height:clamp(340px,calc(100dvh - 300px),720px)}
  .dvh .dvlab{width:38px;inset-inline-start:4px}
  .dvh::after{inset-inline-start:46px}
  .dvnow{inset-inline-start:44px}
  .dvev{inset-inline-start:calc(48px + (100% - 54px) * var(--lane) / var(--lanes));width:calc((100% - 54px) / var(--lanes) - 3px);padding:2px 6px}
  .dvev .cmore6{opacity:1}
  .cltools{gap:8px}.clsearch{flex-basis:100%;max-width:none}
  .cltools > .sp{display:none}
  .cltools .inp.sm{flex:1 1 90px;min-width:0}
  .cltools > .btn{flex:none}
  .calbar{gap:8px 10px}
  .calbar .caltitle{order:-2}
  .calbar .calnav{order:-1}
  .calfilt{display:inline-grid;order:0;flex:none;margin-inline-start:auto}
  .calbar .calviews .seg{order:1;flex:1 1 100%;min-width:0;display:flex}.calbar .calviews .seg button{flex:1;padding-inline:4px}
  .calbar.listv .calviews .seg{flex:1 1 0}.calbar.listv .calfilt{order:1;margin-inline-start:0}
  .calopts{order:2;display:none;flex-wrap:wrap;align-items:center;gap:8px 10px;width:100%;padding-top:2px;animation:fadeIn .25s var(--ease) both}
  .calbar.optsopen .calopts{display:flex}
  .calbar > .sp{display:none}
}
/* الإدارة ← منشورات القناة: أرقام تقود إلى القائمة */
.kpilink{display:block;text-decoration:none;color:inherit;border-radius:var(--r2)}
.kpilink .kpi{height:100%;transition:transform .25s var(--ease),box-shadow .25s}
.kpilink:hover .kpi{transform:translateY(-2px);box-shadow:var(--sh2,var(--sh1))}
/* الأسبوع: الأعمدة ضيقة، فالأيقونة وزر التفاصيل في سطر والعنوان تحتهما */
.cwcol .ccard.post{flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:center}
.cwcol .ccard.post .ccbody{flex:1 1 100%;order:2}
.cwcol .ccard.post span.cst{width:26px;height:26px;border-radius:8px}
.cwcol .ccard.post .cmore6{margin:-4px}

/* ===== editor.css ===== */
/* ================= المحرر: مراجعة التصميم (العناوين، الألوان، الحركة، الأيقونات، النشر) ================= */

/* تحديد النص: لمسة هادئة من لون الواجهة بدل الأسود */
html ::selection{background:var(--ac-t2,rgba(80,70,230,.18));color:var(--ac-ink,inherit)}

/* اسم التصميم هو عنوان الصفحة (h1) دون تغيير في شكله */
.e-h1{margin:0;padding:0;font:inherit;display:flex;align-items:center;min-width:0;flex:0 1 auto}
.e-h1 .e-name{width:auto}
@media (max-width:860px){.e-h1{flex:1 1 60px}.e-h1 .e-name{width:100%;max-width:none}}

/* زر «النشر» في الشريط العلوي: يبقى اسمه ظاهراً */
@media (min-width:1100px){.e-top .e-cap span{display:inline}.e-top .e-cap{padding-inline:14px}}
.e-top .e-cap svg{color:var(--ac)}

/* الشريط الجانبي: «النشر» في أسفله مفصولاً، والتبديل بين الأدوات هادئ */
.e-rail button[data-tab=pub]{margin-top:auto;position:relative}
.e-rail button[data-tab=pub]::before{content:'';position:absolute;top:-6px;right:14px;left:14px;height:1px;background:var(--line)}
.e-rail button{transition:background calc(.25s*var(--k,1)) var(--ease),color calc(.25s*var(--k,1)) var(--ease)}
.e-rail button.on{background:var(--ac);color:#fff;box-shadow:0 6px 16px -10px var(--ac)}

/* ظهور اللوحة: عند تبديل الأداة فقط، خفيف بلا قفز */
.pbody{animation:none}
.pbody.fresh{animation:pIn6 calc(.3s*var(--k,1)) var(--ease) both}
@keyframes pIn6{from{opacity:0;transform:translateY(6px)}}
.e-panel .pbody.fresh > *{animation:pchild6 calc(.36s*var(--k,1)) var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes pchild6{from{opacity:0;transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.pbody.fresh,.e-panel .pbody.fresh > *{animation:none}}

/* عناوين الأقسام: علامة بلون الواجهة، ساكنة */
.e-panel .psh::before{width:5px;height:18px;border-radius:5px;background:linear-gradient(180deg,var(--ac),var(--ac3));animation:none}
.e-panel .psh + p.tiny{background:var(--ac-bg,var(--bg2))}

/* حالات الاختيار بلون الواجهة بدل الأسود */
.bgsw-b.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ac)}
.lrow6.on{background:var(--ac-t)}
.lrow6.on .lnm{color:var(--ac-ink)}
.e-panel .psec .btn.ghost{white-space:normal;text-align:right;height:auto;line-height:1.5}

/* ---------- الأيقونات: البحث فوقها، وثلاثة صفوف صغيرة تُمرَّر أفقياً ---------- */
.icsearch{gap:8px;align-items:center}.icsearch .icq{flex:1;min-width:0}.iccount{flex:none;color:var(--ink3)}
.hpager{position:relative}
.icstrip{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-auto-columns:60px;gap:6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y;padding:2px 2px 4px}
.icstrip::-webkit-scrollbar{display:none}
.icstrip.few{grid-template-rows:auto;grid-auto-flow:row;grid-template-columns:repeat(auto-fill,60px);overflow:visible}
.icb{scroll-snap-align:start;width:60px;height:60px;border:0;border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px 4px;cursor:pointer;transition:background .2s,transform calc(.25s*var(--k,1)) var(--spring)}
.icb svg{width:24px;height:24px;flex:none}.icb canvas{flex:none}
.icb small{font-size:10px;line-height:1.2;color:var(--ink3);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icb:hover{background:var(--ac-t);transform:translateY(-1px)}.icb:hover small{color:var(--ac-ink)}
.icb:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.icnone{grid-row:1/-1;white-space:nowrap}
/* إشارة «المزيد»: تظليل عند الحافة وسهم دائري */
.hpager::before,.hpager::after{content:'';position:absolute;top:0;bottom:4px;width:34px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:1}
.hpager::before{left:0;background:linear-gradient(90deg,var(--card,#fff),transparent)}
.hpager::after{right:0;background:linear-gradient(-90deg,var(--card,#fff),transparent)}
.hpager.more-l::before,.hpager.more-r::after{opacity:1}
.hpnx,.hppv{position:absolute;top:50%;width:30px;height:30px;margin-top:-17px;border-radius:50%;border:0;background:#fff;color:var(--ac);box-shadow:0 2px 10px -2px rgba(0,0,0,.22);display:grid;place-items:center;z-index:2;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--spring)}
.hpnx svg,.hppv svg{width:16px;height:16px}
.hpnx{left:2px}.hppv{right:2px}.hppv svg{transform:scaleX(-1)}
.hpager.more-l .hpnx,.hpager.more-r .hppv{opacity:1;pointer-events:auto}
.hpager.more-l .hpnx{animation:hpNudge 2.4s var(--ease) 1s 2}
@keyframes hpNudge{50%{transform:translateX(-3px)}}

/* ---------- لوحة «النشر» ---------- */
.pubto{display:flex;align-items:flex-start;gap:8px;background:var(--ac-bg,var(--bg2));color:var(--ac-ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.pubto svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--ac)}
.pubto.warn{background:var(--or-t);color:#8a4a12}.pubto.warn svg{color:var(--or)}
.pubgo{display:flex;flex-wrap:wrap;gap:8px}.pubgo .btn{flex:1 1 140px;justify-content:center}
.pubsave{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;color:var(--ink2)}
.publist{display:flex;flex-direction:column;gap:8px}
.pubgrp{font-size:13px;font-weight:600;color:var(--ink3);margin-top:4px}
.pubrow{background:var(--bg2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;border-inline-start:3px solid var(--bl);transition:background .2s}
.pubrow.sent{border-color:var(--gr)}.pubrow.failed{border-color:var(--rd)}.pubrow.cancelled{border-color:var(--line2);opacity:.75}
.pubmain{display:flex;gap:10px;align-items:flex-start;border:0;background:transparent;padding:0;text-align:right;cursor:pointer;width:100%;font:inherit;color:inherit}
.pubmain:hover .pubtime{color:var(--ac-ink)}
.pubth{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--ac-t);color:var(--ac)}.pubth svg{width:20px;height:20px}.pubth.st-sent{background:var(--gr-t);color:var(--gr)}.pubth.st-failed{background:var(--rd-t);color:var(--rd)}.pubth.st-cancelled{background:var(--bg3);color:var(--ink3)}
.pubinfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pubinfo .pill{font-size:11.5px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}.pubinfo .pill svg{width:12px;height:12px}
.pubtime{font-size:14.5px;transition:color .2s}
.pubcap{color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pubacts{gap:6px;padding-inline-start:62px}
.pubempty{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:14px;padding:14px;border-radius:12px;background:var(--bg2)}
.pubempty svg{width:18px;height:18px}
.pubcal{align-self:flex-start}

/* ---------- نافذة النص المصاحب: اسم القناة كاملاً، وزر التأكيد بضغطتين، والخطأ واضح ---------- */
.capsend > .row:first-child{flex-wrap:wrap;row-gap:6px}
.capsend .psh{white-space:normal;overflow:visible}
.btn.arm{background:var(--or)!important;color:#fff!important;box-shadow:0 0 0 4px var(--or-t)!important;animation:armPulse 1.6s var(--ease) infinite}
@keyframes armPulse{50%{box-shadow:0 0 0 7px rgba(248,136,51,.12)}}
@media (prefers-reduced-motion:reduce){.btn.arm{animation:none}}
.capafter.bad{background:var(--rd-t)}
.capafter.bad svg.errc{color:var(--rd);width:20px;height:20px}
.capafter.bad .small{color:#8e2a2a;flex:1 1 160px}
.capafter.bad .errtx{flex:1 1 180px;color:#8e2a2a;line-height:1.7}.capafter.bad .errtx small{display:block;color:#a65b5b;margin-top:2px}
.capsend > small.tiny{margin-top:-4px;color:var(--ink3)}
.e-panel .imgrid > p.tiny{grid-column:1/-1}

/* ===== guide.css ===== */
/* ===== دليل أثر: الصفحة، ومقدمة أول دخول، و«اسأل أثر» ===== */
/* الملصقات (من وحدة الحركة، أو بديل بلون الواجهة) */
.gposter{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:var(--ac-bg)}
.gposter>*:not(.gpi):not(b){width:100%;height:100%;object-fit:cover;display:block}

.gposter.fb::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 15% 100%,rgba(255,255,255,.16),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}
.gposter .gpi{position:relative;width:26%;max-width:96px;aspect-ratio:1;border-radius:28%;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.gposter .gpi svg{width:46%;height:46%}
.gposter.fb b{position:relative;font-family:var(--fd);font-weight:500;font-size:clamp(15px,2.2vw,24px)}
.gplay{position:absolute;top:50%;left:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:var(--ac);box-shadow:0 16px 40px -10px rgba(0,0,0,.45);transition:transform .45s var(--spring),background .25s;pointer-events:none}
.gplay svg{width:42%;height:42%;fill:currentColor;transform:translateX(7%)}
.gplay.sm{width:50px;height:50px;margin:-25px 0 0 -25px}
.gplay.xs{width:30px;height:30px;margin:-15px 0 0 -15px;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.gdur{position:absolute;left:12px;bottom:12px;background:rgba(15,14,30,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:13px;padding:3px 10px;border-radius:99px;font-family:var(--fs)}
.gseen{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);color:#26804a;font-size:13px;padding:3px 10px;border-radius:99px}

/* البطل: الفيلم الكبير والتقدّم */
.ghero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:center;background:linear-gradient(160deg,var(--ac-soft),var(--ac-bg) 70%);border-radius:var(--r3);padding:clamp(14px,2.4vw,26px)}
.gfilm{position:relative;border:0;padding:0;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--ac);box-shadow:0 30px 70px -30px var(--ac2),0 0 0 1px rgba(0,0,0,.04);cursor:pointer}
.gfilm .gposter>*{transition:transform 1.2s var(--ease)}
.gfilm:hover .gposter>*{transform:scale(1.035)}
.gfilm:hover .gplay,.gthumb:hover .gplay{transform:scale(1.08)}
.gfilm:active .gplay,.gthumb:active .gplay{transform:scale(.94)}
.gside{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-inline-end:6px}
.gside h2{font-size:clamp(26px,3vw,36px)}
.gprog{display:flex;align-items:center;gap:12px;margin-top:4px}
.gprog>div{display:flex;flex-direction:column;line-height:1.4}
.gring{position:relative;width:58px;height:58px;flex:none}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring circle{fill:none;stroke-width:6}
.gring .tr{stroke:var(--ac-t2)}
.gring .fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.gring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fs);font-size:13px;color:var(--ac-ink)}
.gcont{max-width:100%}
.gcont span{overflow:hidden;text-overflow:ellipsis}

/* المسار */
.gsec .shead{margin-bottom:14px}
.gpath{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,262px),1fr));gap:18px}
.gstep{background:#fff;border-radius:22px;box-shadow:var(--sh1);overflow:hidden;display:flex;flex-direction:column;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.gstep:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.gstep.next{box-shadow:0 0 0 2px var(--ac),var(--sh2)}
.gthumb{position:relative;border:0;padding:0;aspect-ratio:16/9;background:var(--ac-bg);cursor:pointer;overflow:hidden}
.gstep.seen .gthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(255,255,255,.18),transparent);pointer-events:none}
.gmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gmeta h3{font-size:19px}
.gmeta p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gnum{font-family:var(--fd);font-size:15px;color:var(--ac-ink);letter-spacing:.04em}
.glink{margin-top:auto;padding-top:4px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;text-decoration:none;color:var(--ac-ink);font-size:14.5px}
.glink svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.glink:hover svg{transform:translateX(-3px)}

/* الجولات */
.gtours{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.gtour{border:0;text-align:right;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;cursor:pointer}
.gtour .icon-tile{grid-row:span 2}
.gtour b{font-family:var(--fd);font-weight:500;font-size:18px}

/* الأسئلة الشائعة و«اسأل أثر» */
.gqa{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.gfaqcol{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.gfaq{display:flex;flex-direction:column;width:100%;background:#fff;border-radius:var(--r2);box-shadow:var(--sh1);overflow:hidden}
.gfq{border-bottom:1px solid var(--line)}
.gfq:last-child{border-bottom:0}
.gfq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;cursor:pointer;font-size:16px;transition:background .2s}
.gfq summary::-webkit-details-marker{display:none}
.gfq summary:hover{background:var(--bg2)}
.gfq summary svg{width:18px;height:18px;flex:none;color:var(--ink3);transition:transform .35s var(--ease)}
.gfq[open] summary svg{transform:rotate(180deg);color:var(--ac)}
.gfa{padding:0 18px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--ink2);font-size:15.5px;animation:pIn .35s var(--ease) both}
.gask{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--top) + 16px)}
.gask h3{font-size:20px}
.gask textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r1);padding:11px 14px;font-size:16px;resize:vertical;min-height:84px;outline:none;transition:border-color .2s,box-shadow .2s;background:#fff}
.gask textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-t)}
.gset{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.gset b{font-weight:500}

@media (max-width:860px){.ghero,.gqa{grid-template-columns:1fr}.gask{position:static}}

/* ===== الزر العائم ===== */
.gxfab{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:27;height:50px;min-width:50px;border:0;border-radius:99px;background:var(--ac);color:#fff;display:inline-flex;align-items:center;gap:8px;padding:0 14px;
  box-shadow:0 14px 34px -12px var(--ac2),0 2px 6px rgba(0,0,0,.12);font-size:15px;transition:transform .35s var(--spring),box-shadow .3s,opacity .3s;animation:gxIn .6s var(--ease) both .4s}
.gxfab svg{width:22px;height:22px;flex:none}
.gxfab span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .45s var(--ease)}
.gxfab:hover span,.gxfab:focus-visible span{max-width:120px}
.gxfab:hover{transform:translateY(-2px)}
.gxfab:active{transform:scale(.95)}
body.in-editor .gxfab,body[data-page=login] .gxfab,body.gx-open .gxfab,body.mapp .gxfab,.present6~.gxfab{display:none}
@keyframes gxIn{from{opacity:0;transform:translateY(14px) scale(.9)}}

/* ===== مقدمة أول دخول ===== */
.gx-intro{position:fixed;left:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:29;width:min(390px,calc(100vw - 32px));background:#fff;border-radius:20px;padding:10px;display:flex;gap:12px;align-items:center;
  box-shadow:0 24px 60px -18px rgba(20,18,50,.38),0 0 0 1px rgba(0,0,0,.05);opacity:0;transform:translateY(18px) scale(.98);filter:blur(4px);pointer-events:none;
  transition:opacity calc(.45s*var(--k)) var(--ease),transform calc(.6s*var(--k)) var(--spring),filter calc(.45s*var(--k)) var(--ease)}
.gx-intro.on{opacity:1;transform:none;filter:none;pointer-events:auto}
body.in-editor .gx-intro{top:calc(var(--top) + 12px);bottom:auto}
.gxi-th{position:relative;flex:none;width:118px;aspect-ratio:16/9;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--ac-bg)}
.gxi-th .gposter.fb b{display:none}
.gxi-tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.gxi-tx>b{font-family:var(--fd);font-weight:500;font-size:16px;line-height:1.35;color:var(--ink)}
.gxi-acts{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.gxi-acts .btn.sm{padding:6px 12px}
.gxi-off{font-size:12.5px;color:var(--ink3);padding:4px 6px}

/* ===== «اسأل أثر» ===== */
.gx-av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ac);color:#fff;box-shadow:0 6px 16px -8px var(--ac2)}
.gx-av svg{width:21px;height:21px}
.gx-panel{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:115;width:min(410px,calc(100vw - 32px));height:min(640px,calc(100vh - 100px));background:#fff;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(20,18,50,.5),0 0 0 1px rgba(0,0,0,.05);opacity:0;transform:translateY(22px) scale(.97);transform-origin:left bottom;pointer-events:none;
  transition:opacity calc(.35s*var(--k)) var(--ease),transform calc(.55s*var(--k)) var(--spring)}
.gx-panel.on{opacity:1;transform:none;pointer-events:auto}
.gx-hd{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 10px;padding-inline-start:16px;background:linear-gradient(180deg,var(--ac-soft),#fff);border-bottom:1px solid var(--line)}
.gx-ttl{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.gx-ttl b{font-family:var(--fd);font-weight:500;font-size:18px;color:var(--ink)}
.gx-where{font-size:12.5px;color:var(--ac-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-guide{padding:6px 10px}
.gx-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px;display:flex;flex-direction:column;gap:12px;background:var(--bg2)}
.gx-welcome{display:flex;flex-direction:column;gap:10px;color:var(--ink2);font-size:15.5px;animation:pIn .4s var(--ease) both}
.gx-sugg{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gx-sugg .chip{text-align:right;white-space:normal;line-height:1.45;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink1)}
.gx-sugg .chip:hover{box-shadow:inset 0 0 0 1px var(--ac);color:var(--ac-ink)}
.gx-msg{max-width:88%;border-radius:18px;padding:10px 14px;font-size:15.5px;line-height:1.6;animation:gxMsg .45s var(--ease) both}
.gx-msg.me{align-self:flex-start;background:var(--ac);color:#fff;border-start-start-radius:6px;white-space:pre-wrap}
.gx-msg.bot{align-self:flex-end;background:#fff;box-shadow:var(--sh1);border-start-end-radius:6px;display:flex;flex-direction:column;gap:10px;max-width:94%}
@keyframes gxMsg{from{opacity:0;transform:translateY(8px);filter:blur(3px)}}
.gx-msg.typing{flex-direction:row;gap:5px;padding:14px 16px}
.gx-msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--ac3);animation:gxDot 1.1s ease-in-out infinite}
.gx-msg.typing i:nth-child(2){animation-delay:.15s}.gx-msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes gxDot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.gx-a{color:var(--ink1)}
.gx-steps{list-style:none;counter-reset:gs;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.gx-steps li{counter-increment:gs;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:15px;color:var(--ink1)}
.gx-steps li::before{content:counter(gs,arabic-indic);width:24px;height:24px;border-radius:50%;background:var(--ac-t);color:var(--ac-ink);display:grid;place-items:center;font-size:13px;margin-top:2px}
.gx-links{display:flex;flex-wrap:wrap;gap:6px}
.gx-links .btn svg{width:15px;height:15px}
.gx-clip{background:var(--ac-soft);color:var(--ac-ink)}
.gx-clip:hover{background:var(--ac-t2)}
.gx-solved{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.gx-solved .tiny{margin-inline-end:auto}
.gx-solved .btn.sm{padding:5px 10px;font-size:14px}
.gx-esc{background:var(--ac-soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.gx-sent a{color:var(--ac-ink)}
.gx-note{display:flex;gap:6px;align-items:flex-start;color:var(--ink2);font-size:14.5px}
.gx-note svg{width:17px;height:17px;flex:none;margin-top:3px;color:var(--ac)}
.gx-hit{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gx-hit b{font-weight:500}
.gx-foot{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.gx-in{flex:1;border:1px solid var(--line2);border-radius:18px;padding:9px 14px;font-size:16px;line-height:1.5;resize:none;outline:none;max-height:120px;background:#fff;transition:border-color .2s,box-shadow .2s}
.gx-in:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-t)}
.gx-send{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;flex:none}
.gx-send:hover{background:var(--ac2)}

.gx-elink{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;margin:10px 0 0;padding:4px 0;color:var(--ac-ink);text-decoration:none;font-size:14.5px}
.gx-elink svg{width:14px;height:14px;fill:currentColor}
/* في «ما الجديد» */
.gnews{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:16px;background:var(--ac-soft);text-decoration:none;color:var(--ink1);transition:background .2s}
.gnews:hover{background:var(--ac-t2)}
.gnews .mt{display:flex;flex-direction:column;flex:1;line-height:1.4}
.gnews .mt b{font-family:var(--fd);font-weight:500}
.gnews .mt small{color:var(--ink2);font-size:13.5px}
.gnews>svg{width:18px;height:18px;color:var(--ac)}
.nclip{display:inline-flex;align-items:center;gap:3px;margin-inline-start:8px;font-size:13px;color:var(--ac-ink);text-decoration:none;background:var(--ac-t);padding:1px 9px;border-radius:99px}
.nclip svg{width:12px;height:12px;fill:currentColor}
@media (prefers-reduced-motion:reduce){.gx-intro,.gx-panel{filter:none!important}}
/* «دليل أثر» في شريط التنقل: مميَّز بلون دافئ وأيقونة، فيُعرف من بين الأقسام */
.nav a.nguide{display:inline-flex;align-items:center;gap:6px;color:#9a4a0e;background:linear-gradient(135deg,#fff3e6,#ffe6cc);box-shadow:inset 0 0 0 1px rgba(240,115,31,.28);font-weight:600}
.nav a.nguide svg{width:16px;height:16px;color:#f0731f}
.nav a.nguide:hover{color:#7a3a0b;background:linear-gradient(135deg,#ffecd9,#ffdcb8)}
.nav a.nguide.on{color:#fff;background:linear-gradient(135deg,#f0731f,#d4580c);box-shadow:0 6px 16px -8px #f0731f}
.nav a.nguide.on svg{color:#fff}

/* ===== ia.css ===== */
/* ===== بنية الموقع والصفحات العامة (ia): الرأس، حسابي، الرئيسية، الإدارة ===== */
/* عناوين البطاقات صارت h2 لترتيب العناوين (h1 ← h2)، بالمظهر نفسه */
.card > h2.ch{font-size:19px;margin-bottom:8px;font-weight:500}
.card .acsub{font-family:var(--ft);font-size:14.5px;font-weight:500;color:var(--ac-ink);margin:16px 0 8px}
.card .acsub:first-of-type{margin-top:6px}

/* الرأس: الصورة تُعلَّم حين تكون في صفحاتك الشخصية */
.avatar{transition:box-shadow .25s var(--ease)}
.avatar.on{box-shadow:0 0 0 3px var(--ac-t2,rgba(0,0,0,.15))}

/* رابط العودة إلى «حسابي» من أسبوعي ومراجعاتي */
.crumb{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;color:var(--ac-ink);text-decoration:none;font-size:14.5px;padding:4px 10px 4px 12px;border-radius:99px;background:var(--ac-t);transition:background .2s}
.crumb:hover{background:var(--ac-t2)}
.crumb svg{width:16px;height:16px}

/* الرئيسية: «القادم في التقويم» في عمود التحية بجانب الساعة، فلا فراغ تحتها */
.hero2{align-items:stretch}
.hero2 .hgreet{justify-content:flex-start}
.hero2 .hup{margin-top:auto;width:100%;max-width:640px;background:var(--ac-bg,#fafafa);border-radius:var(--r2);box-shadow:0 0 0 1px var(--ac-t,var(--line));padding:12px 14px}
.hero2 .hup .calmini{display:flex;flex-direction:column;gap:2px}
.hero2 .hup .calmini > .row{align-items:center;margin-bottom:2px}
.hero2 .hup .psh{margin:0;color:var(--ac-ink);font-weight:600;font-size:15px}
.hero2 .hup .calmini > p.tiny{margin:2px 0 0}
.hero2 .hup .prow6:hover{background:#fff}
.hero2 .clock6{align-self:start}
@media (max-width:900px){.hero2 .hup{margin-top:4px;max-width:none}}

/* أسبوعك في أثر: بلون الواجهة بدل الأسود */
.wkmini{background:linear-gradient(150deg,var(--ac2,#141414),var(--ac,#2b2440) 75%,var(--ac3,#2b2440))}
.wkmini::after{background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}

/* طرق البدء في صفحة الهوية: ثلاث بطاقات */
.quick{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.quick{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.quick{gap:8px;padding:8px;margin-top:14px}.qcard{flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 6px}.qcard b{font-size:16px}.qcard span:not(.icon-tile){display:none}}

/* الهويات على الشاشات الصغيرة: عمودان بدل قائمة طويلة */
@media (max-width:600px){.idgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.idlogo{height:104px;padding:14px}.idlogo img{max-height:72px}.idcard .idmeta{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px}.idcard .idmeta b{font-size:15px}}

/* حسابي */
.grid.two.acgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.grid.two.acgrid{grid-template-columns:1fr}}
.acacts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:stretch}
.acacts .wkmini{height:100%}
.acrv{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;align-items:flex-start}
.acrv h3{margin:4px 0 0}
.acrv p{margin:0}
.acpage .hsec .shead p{margin:4px 0 0}
@media (max-width:760px){.acacts{grid-template-columns:1fr}}

/* لوحة الإدارة: الأقسام مجمّعة بعناوين صغيرة */
.anav.grouped{gap:12px}
.agrp{display:flex;flex-direction:column;gap:2px}
.agh{font-size:12.5px;font-weight:600;color:var(--ac-ink,var(--ink3));padding:4px 12px 2px;opacity:.85}
@media (max-width:900px){
  .anav.grouped{flex-direction:row;gap:6px;overflow-x:auto;scrollbar-width:thin}
  .agrp{flex-direction:row;gap:2px;flex:none;padding-inline-end:6px;border-inline-end:1px solid var(--line)}
  .agrp:last-child{border:0}
  .agh{display:none}
}
.wkmini .wkmore{color:#fff;opacity:.92}
.wkmini .wknums small{opacity:.85}
/* القائمة الجانبية للإدارة: تبقى ظاهرة كاملة، وتُمرَّر وحدها إن طالت عن الشاشة */
@media (min-width:901px){
  .anav{max-height:calc(100vh - var(--top) - 32px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .anav.grouped{gap:6px}
  .anav a{padding:7px 12px}
}
/* تلخيص المساعد في إشعارات المدير */
.ntrow .ntt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ntsum{display:flex;align-items:flex-start;gap:5px;font-size:13px;line-height:1.5;color:var(--ac-ink);background:var(--ac-soft);border-radius:8px;padding:4px 8px}
.ntsum svg{width:14px;height:14px;flex:none;margin-top:3px}
/* عارض الصورة بملء الشاشة */
.imgview{position:fixed;inset:0;z-index:300;background:rgba(14,12,28,.92);display:flex;flex-direction:column;opacity:0;transition:opacity .25s}
.imgview.on{opacity:1}
.ivbar{display:flex;align-items:center;gap:6px;padding:10px 14px;color:#fff;flex:none}
.ivbar .ib{color:#fff}.ivbar .ib:hover{background:rgba(255,255,255,.12)}
.ivstage{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:0 16px 16px}
.ivstage img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;cursor:zoom-in;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.imgview.full .ivstage{place-items:start}
.imgview.full .ivstage img{max-width:none;max-height:none;cursor:zoom-out}
.rvimg{position:relative}.rvimg .rvbig{position:absolute;bottom:8px;left:8px;box-shadow:var(--sh1);background:#fff}

/* ===== imgtools.css ===== */
/* أدوات تعديل الصورة في المحرر */
.imgtools { display: grid; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line, #e6e6e6); }
.fxrow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.fxb { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; font: inherit; font-size: .74rem; color: var(--ink2, #444); cursor: pointer; }
.fxb canvas { width: 58px; height: 58px; border-radius: 12px; display: block; outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
.fxb.on canvas { outline-color: var(--ac, #222); }
.fxb.on span { color: var(--ac-ink, #111); font-weight: 700; }

/* شريط القصّ المباشر */

/* ===== progmark.css ===== */
/* شعار البرنامج المفتوح في الرئيسية: سطر واحد مكان التحية، الشعار يُكتب من اليمين ثم يظهر خط ذهبي والدفعة */
.pmark { display: flex; align-items: center; gap: 14px; margin: 0; max-width: 100%; }
.pmark-logo { position: relative; display: block; flex: none; padding-bottom: 6px; }
.pmark-cv { display: block; height: 54px; width: auto; animation: pmWrite 1.25s cubic-bezier(.65,0,.25,1) .15s both; }
.pmark-logo::after { content: ''; position: absolute; right: 6%; bottom: 0; height: 2px; width: 88%; border-radius: 2px; background: linear-gradient(270deg, var(--pm-ac), transparent);
  transform-origin: right; animation: pmLine .7s cubic-bezier(.3,.7,.2,1) 1.2s both; }
.pmark-txt { display: flex; flex-direction: column; gap: 2px; padding-inline-start: 14px; border-inline-start: 1px solid var(--line, #e3e3e3); animation: pmFade .6s ease 1.1s both; }
.pmark-tag { color: var(--pm-ac); font-size: .9rem; font-weight: 700; line-height: 1.4; }
.pmark-greet { color: var(--ac-ink, #555); font-size: .92rem; line-height: 1.4; }
.pmark-m { gap: 10px; }
.pmark-m .pmark-cv { height: 40px; }
.pmark-m .pmark-txt { padding-inline-start: 10px; }
.pmark-m .pmark-tag { font-size: 13px; } .pmark-m .pmark-greet { font-size: 14px; color: var(--ios-label2, #666); }
@keyframes pmWrite { from { clip-path: inset(0 0 0 100%); opacity: .2; } 40% { opacity: 1; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
@keyframes pmLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pmFade { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pmark-cv, .pmark-logo::after, .pmark-txt { animation: none; } }
/* خيارات شعار الهوية ودفعتها في المحرر */
.lgopts { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line, #e6e6e6); display: grid; gap: 8px; }
.lgvers { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.lgver { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border-radius: 12px; border: 1.5px solid var(--line, #e3e3e3); background: #f7f5f0; cursor: pointer; font: inherit; font-size: .78rem; }
.lgver img { width: 100%; height: 46px; object-fit: contain; }
.lgver.on { border-color: var(--ac, #222); box-shadow: 0 0 0 3px var(--ac-soft, rgba(0,0,0,.08)); }
.lgbatch { align-items: center; gap: 8px; }
.lgbatch .lgnum { width: 110px; flex: none; text-align: center; }
/* لوحة الإدارة: نسخ الشعار والدفعة */
.lgadm { display: grid; gap: 10px; }
.lgvlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.lgvrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line, #e6e6e6); border-radius: 10px; background: #faf9f6; }
.lgvth { width: 64px; height: 36px; flex: none; background: center/contain no-repeat; }
.lgvrow .inp { min-width: 0; flex: 1; }
.lgprev { width: 100%; max-width: 360px; height: auto; background: #f4f1ea; border-radius: 12px; display: block; }

/* ===== slides.css ===== */
/* ===== الشرائح: حركة العناصر، والانتقال بين الشرائح، والعرض الحي، ولوحة الحركة، وإعدادات الوسائط ===== */

/* --- حركات دخول العناصر: تُطبَّق على طبقة بحجم الشريحة فيها العنصر وحده (في العرض وفي معاينات اللوحة) --- */
.pan{animation-duration:var(--dur,.75s);animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1);pointer-events:none;
  --ct:0%;--cr:0%;--cb:0%;--cl:0%;--cl0:100%;--bh:100%;--cx:50%;--cy:50%;--rad:75%;--mv:1}
.an-fade{animation-name:anFade}.an-up{animation-name:anUp}.an-down{animation-name:anDown}.an-right{animation-name:anRight}.an-left{animation-name:anLeft}
.an-blur{animation-name:anBlur}.an-zoom{animation-name:anZoom}.an-near{animation-name:anNear}
.an-pop{animation-name:anPop;animation-timing-function:cubic-bezier(.3,.7,.4,1)}
.an-bounce{animation-name:anBounce;animation-timing-function:ease-out}
.an-drop{animation-name:anDrop;animation-timing-function:cubic-bezier(.3,.8,.4,1)}
.an-spin{animation-name:anSpin}.an-flip{animation-name:anFlip}.an-glow{animation-name:anGlow}
.an-wipe{animation-name:anWipe;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.an-rise{animation-name:anRise;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.an-iris{animation-name:anIris;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.an-type{animation-name:anWipe;animation-timing-function:steps(18,end)}
.an-swipe{animation-name:anSwipeIn;animation-timing-function:linear}
@keyframes anFade{from{opacity:0}to{opacity:1}}
@keyframes anUp{from{opacity:0;transform:translateY(calc(7% * var(--mv)))}to{opacity:1;transform:none}}
@keyframes anDown{from{opacity:0;transform:translateY(calc(-7% * var(--mv)))}to{opacity:1;transform:none}}
@keyframes anRight{from{opacity:0;transform:translateX(calc(9% * var(--mv)))}to{opacity:1;transform:none}}
@keyframes anLeft{from{opacity:0;transform:translateX(calc(-9% * var(--mv)))}to{opacity:1;transform:none}}
@keyframes anBlur{from{opacity:0;filter:blur(16px);transform:scale(1.03)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes anZoom{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes anNear{from{opacity:0;transform:scale(1.45);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes anPop{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.09)}78%{transform:scale(.97)}100%{opacity:1;transform:none}}
@keyframes anBounce{0%{opacity:0;transform:translateY(calc(-20% * var(--mv)))}42%{opacity:1;transform:translateY(0)}60%{transform:translateY(calc(-5% * var(--mv)))}76%{transform:translateY(0)}88%{transform:translateY(calc(-1.4% * var(--mv)))}100%{opacity:1;transform:none}}
@keyframes anDrop{0%{opacity:0;transform:translateY(calc(-14% * var(--mv)))}70%{opacity:1;transform:translateY(calc(1.2% * var(--mv)))}100%{opacity:1;transform:none}}
@keyframes anSpin{from{opacity:0;transform:rotate(-14deg) scale(.7)}to{opacity:1;transform:none}}
@keyframes anFlip{from{opacity:0;transform:perspective(1400px) rotateX(-80deg)}to{opacity:1;transform:none}}
@keyframes anGlow{0%{opacity:0;filter:brightness(2.6) blur(8px)}55%{opacity:1;filter:brightness(1.5) blur(0)}100%{opacity:1;filter:none}}
/* المسح والكتابة: من اليمين إلى اليسار داخل حدود العنصر */
@keyframes anWipe{from{clip-path:inset(var(--ct) var(--cr) var(--cb) var(--cl0))}to{clip-path:inset(var(--ct) var(--cr) var(--cb) var(--cl))}}
/* الانبثاق: العنصر يصعد من خلف حدّه السفلي، والنافذة ثابتة */
@keyframes anRise{from{transform:translateY(var(--bh));clip-path:inset(max(0%, calc(var(--ct) - var(--bh))) var(--cr) calc(var(--cb) + var(--bh)) var(--cl))}to{transform:none;clip-path:inset(var(--ct) var(--cr) var(--cb) var(--cl))}}
@keyframes anIris{from{clip-path:circle(0% at var(--cx) var(--cy))}to{clip-path:circle(var(--rad) at var(--cx) var(--cy))}}
/* الستارة اللونية: شريط بلون الهوية يغطي مكان العنصر ثم ينسحب كاشفاً إياه */
@keyframes anSwipeIn{0%,49%{opacity:0}50%,100%{opacity:1}}
.pswipe{position:absolute;display:block;z-index:1;pointer-events:none;background:var(--swc,var(--ac));border-radius:3px;animation:anSwipeBar var(--dur,.9s) cubic-bezier(.65,0,.35,1) both}
@keyframes anSwipeBar{0%{clip-path:inset(0 0 0 100%)}50%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}

/* --- العرض الحي --- */
.pstage{perspective:2200px}
.pslide{position:absolute;inset:0;transform-origin:50% 50%}
.pprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08);z-index:2;opacity:0;transition:opacity .3s}

.pgrid{position:absolute;inset:0;z-index:4;background:rgba(10,10,16,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:auto;padding:72px 24px 28px;animation:fadeIn .25s both}

/* الوسائط فوق مكانها */
.pmbox{transition:left .55s var(--ease),top .55s var(--ease),width .55s var(--ease),height .55s var(--ease),border-radius .55s var(--ease)}
.pmbox.pm-yt,.pmbox.pm-video{background:#000}

.pmbox.full::before{display:none}
.pmbox.full::after{display:none}
.pmthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pmtitle{position:absolute;bottom:0;left:0;right:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:clamp(12px,1.5vw,22px);text-align:center;pointer-events:none;line-height:1.5}
.pmtap{position:absolute;inset:0;background:transparent;border:0;cursor:pointer}

/* --- صفحة الشرائح: لا تتمدد بعرض شريط العروض (في التطبيق كانت تتسع الصفحة فيصغر كل شيء) --- */
.slhero,.slpage{max-width:min(1180px,100%);min-width:0}

.antabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg3);border-radius:12px;padding:3px;gap:2px}

.anapply{gap:8px}

.anprev{width:100%;justify-content:center}

.mposb i{position:relative;display:block;width:34px;height:20px;border-radius:4px;background:var(--bg3);box-shadow:inset 0 0 0 1px var(--line2)}
.mposb i::after{content:'';position:absolute;background:var(--ac);border-radius:2px}
.mp-full::after{inset:2px}.mp-mid::after{inset:4px 8px}.mp-right::after{top:4px;bottom:4px;right:2px;width:44%}.mp-left::after{top:4px;bottom:4px;left:2px;width:44%}.mp-corner::after{left:2px;bottom:2px;width:36%;height:40%}

/* --- افتح في كانفا --- */
.cvsteps{margin:0;padding-inline-start:20px;line-height:1.9;color:var(--ink2);font-size:14.5px}
.cvst{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--ink2);padding:10px 12px;border-radius:12px;background:var(--bg2)}
.cvst.done{background:var(--ac-soft)}
.cvgo{align-self:flex-start;display:inline-flex;gap:8px}

/* التلاوة في العرض الحي */
.pmbox.pm-audio,.pmbox.pm-audio.playing::after{border-radius:999px}
.pmbox.pm-tl{overflow:visible}
.pm-tl .tlbar{position:absolute;inset:auto 14% 12% 14%;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;opacity:0;transition:opacity .3s;pointer-events:none}
.pm-tl.playing .tlbar{opacity:1}
.pm-tl .tlprog{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .25s linear}
.pm-tl .tlnum{position:absolute;top:50%;left:-8px;transform:translate(-100%,-50%);min-width:2.2em;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:clamp(11px,1.3vw,17px);text-align:center;pointer-events:none;animation:fadeIn .3s both}
.pm-tl .tlqari{position:absolute;bottom:calc(100% + 8px);right:50%;transform:translateX(50%);white-space:nowrap;padding:5px 13px;border-radius:999px;border:0;background:rgba(0,0,0,.62);color:#fff;font:inherit;font-size:12.5px;cursor:pointer;opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pm-tl .tlqari::after{content:' ▾';opacity:.75}
.present6.awake .pm-tl .tlqari,.present6.touch .pm-tl .tlqari,.pm-tl:hover .tlqari,.pm-tl .tlqari:focus-visible{opacity:1}
.pm-tl .tlmenu{position:absolute;bottom:calc(100% + 44px);right:50%;transform:translateX(50%);z-index:5;max-height:min(58vh,420px);overflow:auto;min-width:230px;padding:6px;border-radius:14px;background:rgba(18,18,20,.94);box-shadow:0 14px 44px rgba(0,0,0,.45);animation:popIn .2s both}
.pm-tl.tl-down .tlqari{bottom:auto;top:calc(100% + 8px)}
.pm-tl.tl-down .tlmenu{bottom:auto;top:calc(100% + 44px)}
.pm-tl .tlmenu button{display:block;width:100%;text-align:right;padding:8px 12px;border:0;border-radius:9px;background:none;color:#fff;font:inherit;font-size:14px;cursor:pointer}
.pm-tl .tlmenu button:hover{background:rgba(255,255,255,.1)}
.pm-tl .tlmenu button.on{background:rgba(255,255,255,.18);font-weight:600}
.pm-tl .tlmenu small{display:block;opacity:.7;font-size:11.5px;font-weight:400}
.tlrange{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tlrange label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.tlinfo{margin:-2px 0 4px;color:var(--ink2)}
.vrun{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;border-radius:12px;background:var(--ac-soft)}

</style>
